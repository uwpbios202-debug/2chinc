<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Property Owner — 2nd Chance Housing</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal/portal.css">
<style>
.hub{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:14px}
.hub a.card{display:block;border:1px solid var(--line);border-radius:8px;padding:16px;background:var(--panel);text-decoration:none;color:var(--fg)}
.hub a.card:hover{border-color:var(--accent)}
.hub .card h3{margin:0 0 4px;font-size:1.05rem;color:var(--accent)}
.hub .card p{margin:0;color:var(--muted);font-size:.92rem}
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:6px}
.crumbs a{color:var(--accent)}
ol.flow{padding-left:20px;display:grid;gap:6px}
.chip{display:inline-block;padding:1px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent);font-size:.8rem;font-weight:600}
.soon{color:var(--muted);font-style:italic}
</style>
</head>
<body>
<div class="appbar"><div class="appbar-in">
  <a class="org" href="/" style="color:inherit;text-decoration:none">2nd Chance Housing<span>Staff &amp; portals</span></a>
  <div class="row" style="flex-wrap:wrap"><a class="linkbtn" href="/properties/">Properties</a><a class="linkbtn" href="/association-owners/">Association Owners</a><a class="linkbtn" href="/property-owners/">Property Owners</a><a class="linkbtn" href="/leasing/">Leasing</a><a class="linkbtn" href="/accounting/">Accounting</a><a class="linkbtn" href="/maintenance/">Maintenance</a><a class="linkbtn" href="/inspections/">Inspections</a><a class="linkbtn" href="/documents/">Documents</a><a class="linkbtn" href="/sitemap/">Site map</a></div>
</div></div>
<main class="wrap">
  <header><div class="crumbs"><a href="/">Home</a> › <a href="/property-owners/">Property Owners</a> › Property Owner</div><h1>Property Owner</h1><p class="lead">Owner page for one property.</p></header>
<div id="box" class="panel"><p class="soon">Loading…</p></div>
</main>
<script>
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const id=new URLSearchParams(location.search).get("id");
fetch("/data/properties.json").then(r=>r.json()).then(({properties})=>{
  const p=properties.find(x=>x.id===id&&x.type==="owner");
  const box=document.getElementById("box");
  if(!p){box.innerHTML="<p>Property not found. <a href='/property-owners/'>Back to Property Owners</a></p>";return;}
  document.querySelector("h1").textContent=p.name;
  box.innerHTML=`<p>${esc(p.address)}</p><ul><li><a href="/inspections/schedule/">Inspection schedule</a></li>${p.id==="3446-n-12th"?`<li><a href="/resident/#landcontract"><b>Land contract</b>: amortization schedule, interest by year, your documents (sign in)</a></li><li><a href="https://paywater.milwaukee.gov/app/" target="_blank" rel="noopener">Water bill: view and pay (Milwaukee Water Works)</a></li><li><a href="https://cityofmilwaukeewi.tylerportico.com/navigator/public/selections/navigator" target="_blank" rel="noopener">Property tax bill: view and pay (City of Milwaukee)</a></li>`:""}<li><a href="/documents/owner/">Owner documents</a></li><li><a href="/accounting/owner-side/">Owner accounting</a></li></ul><p class="soon">Online statements and payments for this property are coming. Until then, call (262) 236-5443 or email info@2ndchinc.org.</p>`;
});
</script>
</body>
</html>
