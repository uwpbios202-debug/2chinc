<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Unit Inspection — 2nd Chance Housing</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal/portal.css">
<style>
.crumbs{font-size:.9rem;color:var(--muted);margin-bottom:6px}.crumbs a{color:var(--accent)}
.area{margin-bottom:16px}.area h2{margin:0 0 8px;font-size:1.15rem;display:flex;justify-content:space-between;gap:8px}
.area h2 small{font-weight:400;color:var(--muted);font-size:.85rem}
.item{padding:9px 0;border-top:1px solid var(--line);display:grid;gap:6px}
.item .top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.item .name{min-width:140px;font-weight:600}
.item .st{display:flex;gap:4px;flex-wrap:wrap}
.item .st label{border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.9rem;background:var(--panel)}
.item .st input{position:absolute;opacity:0}
.item .st label:has(input[value="OK"]:checked){background:var(--ok-soft);border-color:var(--ok);color:var(--ok);font-weight:700}
.item .st label:has(input[value="Needs repair"]:checked){background:var(--bad-soft);border-color:var(--bad);color:var(--bad);font-weight:700}
.item .st label:has(input[value="N/A"]:checked){background:var(--off-soft);border-color:var(--off);font-weight:700}
.item .tools{display:flex;gap:6px;margin-left:auto}
.ib{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;cursor:pointer;font-size:.9rem}
.ib.rec{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.item textarea{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--fg);width:100%;min-height:36px;resize:vertical}
.thumbs{display:flex;gap:6px;flex-wrap:wrap}
.thumbs img{width:84px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
.thumbs .ph{position:relative;display:inline-block}
.thumbs .ph .del{position:absolute;top:-6px;right:-6px;width:26px;height:26px;border-radius:50%;border:1px solid var(--bad);background:var(--panel);color:var(--bad);font-weight:700;line-height:1;cursor:pointer;padding:0}
.saved{font-size:.85rem;color:var(--muted)}
.hist a{display:block;padding:6px 0;border-top:1px solid var(--line)}
@media print{.appbar,.noprint,.tools{display:none}.item .st label:not(:has(input:checked)){display:none}}
</style>
</head>
<body>
<div class="appbar" data-nav="staff"><div class="appbar-in">
  <a class="org" href="/" style="color:inherit;text-decoration:none">2nd Chance Housing<span>Inspection</span></a>
  <div class="row" id="userBar" hidden><button class="linkbtn" type="button" id="signOutBtn">Sign out</button></div>
</div></div>
<main class="wrap">
  <div id="signin" class="narrow"></div>
  <div id="app" hidden>
    <header>
      <div class="crumbs"><a href="/staff/">My units</a> › <span id="crumb">Unit</span></div>
      <h1 id="title">Unit inspection</h1>
      <p class="lead" id="addr"></p>
    </header>
    <div class="panel noprint" style="margin-bottom:16px">
      <div class="row" style="flex-wrap:wrap;gap:12px;align-items:flex-end">
        <label style="display:grid;gap:3px;font-size:.85rem;color:var(--muted)">Inspection date<input type="date" id="idate" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px"></label>
        <label style="display:grid;gap:3px;font-size:.85rem;color:var(--muted)">Purpose<select id="ipurpose" style="font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px"><option value="routine">Routine</option><option value="annual">Annual</option><option value="pre_move_in">Pre-move-in</option><option value="pre_move_out">Pre-move-out</option><option value="follow_up">Follow-up</option><option value="complaint">Complaint</option><option value="other">Other</option></select></label>
        <button class="btn" type="button" id="allok">Mark unchecked items OK</button>
        <button class="btn" type="button" id="print">Print</button>
        <button class="btn primary" type="button" id="submit">Submit inspection</button>
        <button class="btn" type="button" id="reopen" hidden>Reopen for editing</button>
        <span class="saved" id="saved"></span>
      </div>
      <p class="sub" id="summary" style="margin:10px 0 0"></p>
      <div class="msg" id="msg" role="status"></div>
    </div>
    <div id="areas"></div>
    <section class="panel noprint hist" id="hist" style="margin-top:16px"></section>
  </div>
</main>

<input type="file" id="camIn" accept="image/*" capture="environment" hidden>

<script type="module">
import { client, $, esc, fmtDate, signIn, signOut, errorText } from "/assets/portal/portal.js";

const q = new URLSearchParams(location.search), pid = q.get("p"), unit = q.get("u") || "_", reqId = q.get("id");
const STAFF_ROLES = ["staff", "field"];
const who = await signIn($("signin"), { audience: "field" });
const meEmail = ((await client.auth.getSession()).data.session || { user: {} }).user.email || "";
$("signOutBtn").onclick = signOut; $("userBar").hidden = false;
if (!STAFF_ROLES.includes(who.role)) {
  $("signin").hidden = false;
  $("signin").innerHTML = `<div class="panel"><p>This page is for inspection staff. <a href="/">Back to the home page</a></p></div>`;
  throw new Error("not staff");
}

const [{ properties }, tpl] = await Promise.all([fetch("/data/properties.json").then((r) => r.json()), fetch("/data/inspection-template.json").then((r) => r.json())]);
const prop = properties.find((x) => x.id === pid);
const unitOk = prop && (unit === "_" ? prop.units.length === 0 : prop.units.includes(unit));
if (!unitOk) { $("signin").hidden = false; $("signin").innerHTML = `<div class="panel">Unit not found. <a href="/staff/">Back to My units</a></div>`; throw new Error("bad unit"); }
const label = unit === "_" ? "Whole property" : "Unit " + unit;
document.title = prop.name + " " + label + " inspection — 2nd Chance Housing";
$("title").textContent = prop.name + " · " + label; $("crumb").textContent = prop.name + " " + label; $("addr").textContent = prop.address;

// ---- load: a chosen inspection, else the newest draft, else a new one ----
let insp = null;
if (reqId) {
  const { data } = await client.rpc("field_get_inspection", { p_id: reqId });
  insp = data;
} else {
  const { data: list, error } = await client.rpc("field_list_inspections", { p_property: pid, p_unit: unit });
  if (error) { $("signin").hidden = false; $("signin").innerHTML = `<div class="panel">${esc(await errorText(error))} <a href="/staff/">Back to My units</a></div>`; throw error; }
  const draft = (list || []).find((i) => i.status === "draft");
  if (draft) { const { data } = await client.rpc("field_get_inspection", { p_id: draft.id }); insp = data; }
  window.HIST = list || [];
}
if (reqId && !insp) { $("signin").hidden = false; $("signin").innerHTML = `<div class="panel">Inspection not found. <a href="/staff/">Back to My units</a></div>`; throw new Error("no inspection"); }
const id = insp ? insp.id : crypto.randomUUID();
let state = (insp && insp.data) || {}; state.items = state.items || {}; state.meta = state.meta || {};
let submitted = !!insp && insp.status === "submitted";
let date = (insp && insp.inspected_on) || new Date().toLocaleDateString("en-CA");
// Purpose and appointment: from the saved inspection, else from the schedule page's link (?purpose=&appt=).
const PURPOSES = { routine: "Routine", annual: "Annual", pre_move_in: "Pre-move-in", pre_move_out: "Pre-move-out", follow_up: "Follow-up", complaint: "Complaint", other: "Other" };
let purpose = (insp && insp.purpose) || (PURPOSES[q.get("purpose")] ? q.get("purpose") : "routine");
const appt = (insp && insp.appointment_id) || (/^[0-9a-f-]{36}$/.test(q.get("appt") || "") ? q.get("appt") : null);
const keyOf = (a, it) => a.id + "|" + it;
const slug = (s) => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");

// ---- render ----
const box = $("areas");
box.innerHTML = tpl.areas.map((a) => `<section class="panel area" data-area="${a.id}"><h2>${esc(a.name)}<small class="cnt"></small></h2>` +
  a.items.map((it) => { const k = keyOf(a, it), s = state.items[k] || {};
    return `<div class="item" data-k="${esc(k)}"><div class="top"><div class="name">${esc(it)}</div>
      <div class="st">${tpl.statuses.map((v) => `<label><input type="radio" name="${esc(k)}" value="${v}"${s.s === v ? " checked" : ""}><span>${v}</span></label>`).join("")}</div>
      <div class="tools"><button type="button" class="ib" data-mic title="Dictate a note">🎤</button><button type="button" class="ib" data-cam title="Take a photo with the phone camera (flash available)">📷</button></div></div>
      <textarea rows="1" placeholder="Notes (type, or tap the microphone)" data-note>${esc(s.n || "")}</textarea>
      <div class="thumbs" data-thumbs></div></div>`; }).join("") + `</section>`).join("");
$("idate").value = date; $("ipurpose").value = purpose;

function setMsg(t, kind = "err") { const m = $("msg"); m.className = "msg " + kind; m.textContent = t; }
function summarize() {
  const ks = Object.keys(state.items); let ok = 0, bad = 0, na = 0, total = 0;
  tpl.areas.forEach((a) => a.items.forEach((it) => { total++; const s = (state.items[keyOf(a, it)] || {}).s; if (s === "OK") ok++; else if (s === "Needs repair") bad++; else if (s === "N/A") na++; }));
  $("summary").textContent = `${total} items: ${ok} OK, ${bad} need repair, ${na} N/A, ${total - ok - bad - na} not yet checked.`;
  box.querySelectorAll(".area").forEach((sec) => { const its = [...sec.querySelectorAll(".item")]; sec.querySelector(".cnt").textContent = its.filter((i) => (state.items[i.dataset.k] || {}).s).length + " of " + its.length + " checked"; });
}
async function paintThumbs(itemEl) {
  const k = itemEl.dataset.k, paths = (state.items[k] || {}).photos || [], t = itemEl.querySelector("[data-thumbs]");
  if (!paths.length) { t.innerHTML = ""; return; }
  const { data, error } = await client.storage.from("inspections").createSignedUrls(paths, 3600);
  if (error) { t.innerHTML = `<span class="sub">Photos could not be loaded: ${esc(error.message || "error")}</span>`; return; }
  t.innerHTML = (data || []).map((x, i) => x.signedUrl ? `<span class="ph"><img src="${esc(x.signedUrl)}" alt="Photo ${i + 1}" data-full="${esc(x.signedUrl)}"><button type="button" class="del" data-del="${esc(paths[i])}" title="Delete this photo" aria-label="Delete photo ${i + 1}">×</button></span>` : "<span class=\"sub\">Photo not available</span>").join("");
}
const itemEl = (k) => [...box.querySelectorAll(".item")].find((e) => e.dataset.k === k);
box.querySelectorAll(".item").forEach(paintThumbs);

// ---- saving ----
let timer = null, saving = false, dirty = false;
function touch() { dirty = true; $("saved").textContent = "Unsaved changes…"; clearTimeout(timer); timer = setTimeout(save, 1200); }
async function save(submit = false) {
  if (submitted) return true;
  if (saving) { dirty = true; return false; }
  saving = true; dirty = false;
  const { error } = await client.rpc("field_save_inspection", { p_id: id, p_property: pid, p_unit: unit, p_date: date, p_data: state, p_submit: submit, p_purpose: purpose, p_appointment: appt });
  saving = false;
  if (error) { $("saved").textContent = "Not saved"; setMsg(await errorText(error)); return false; }
  $("saved").textContent = submit ? "Submitted" : "Saved " + new Date().toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  if (dirty && !submit) touch();
  return true;
}
function lock() {
  box.querySelectorAll("input, textarea, button").forEach((x) => x.disabled = true);
  ["allok", "submit", "idate", "ipurpose"].forEach((i) => $(i).disabled = true);
  setMsg("This inspection was submitted and is read-only.", "ok");
}
window.addEventListener("beforeunload", (e) => { if (dirty || saving) { e.preventDefault(); e.returnValue = ""; } });

box.addEventListener("change", (e) => { if (e.target.type === "radio") { const k = e.target.name; state.items[k] = { ...(state.items[k] || {}), s: e.target.value }; summarize(); touch(); } });
box.addEventListener("input", (e) => { if (e.target.matches("[data-note]")) { const k = e.target.closest(".item").dataset.k; state.items[k] = { ...(state.items[k] || {}), n: e.target.value }; touch(); } });
$("idate").oninput = () => { date = $("idate").value || date; touch(); };
$("ipurpose").onchange = () => { purpose = $("ipurpose").value; touch(); };
$("allok").onclick = () => { tpl.areas.forEach((a) => a.items.forEach((it) => { const k = keyOf(a, it); if (!(state.items[k] || {}).s) { state.items[k] = { ...(state.items[k] || {}), s: "OK" }; const r = itemEl(k).querySelector('input[value="OK"]'); r.checked = true; } })); summarize(); touch(); };
$("print").onclick = () => window.print();
if (who.role === "staff" && submitted && insp) $("reopen").hidden = false;
$("reopen").onclick = async () => {
  if (!confirm("Reopen this inspection so it can be edited and submitted again?")) return;
  const { error } = await client.rpc("inspection_reopen", { p_id: id });
  if (error) return setMsg(await errorText(error));
  location.reload();
};
$("submit").onclick = async () => {
  if (!confirm("Submit this inspection? It can't be edited afterward.")) return;
  clearTimeout(timer);
  if (await save(true)) { submitted = true; lock(); loadHistory(); }
};

// ---- microphone: dictation into the note (browser speech recognition) ----
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, recBtn = null;
function stopRec() { if (rec) { try { rec.stop(); } catch (e) { /* already stopped */ } } }
box.addEventListener("click", (e) => {
  const mic = e.target.closest("[data-mic]");
  if (mic) {
    if (!SR) return setMsg("Dictation isn't supported in this browser. Type the note, or use Chrome or Safari.");
    if (recBtn === mic) return stopRec();
    stopRec();
    const item = mic.closest(".item"), ta = item.querySelector("[data-note]"), k = item.dataset.k;
    const r = new SR(); r.lang = "en-US"; r.interimResults = false; r.continuous = true;
    r.onresult = (ev) => {
      let add = ""; for (let i = ev.resultIndex; i < ev.results.length; i++) if (ev.results[i].isFinal) add += ev.results[i][0].transcript;
      if (add) { ta.value = (ta.value ? ta.value.replace(/\s*$/, " ") : "") + add.trim(); state.items[k] = { ...(state.items[k] || {}), n: ta.value }; touch(); }
    };
    r.onerror = (ev) => { setMsg(ev.error === "not-allowed" ? "Microphone access is blocked. Allow it in the browser's site settings." : "Dictation stopped: " + ev.error); };
    r.onend = () => { mic.classList.remove("rec"); mic.textContent = "🎤"; if (recBtn === mic) { recBtn = null; rec = null; } };
    rec = r; recBtn = mic; mic.classList.add("rec"); mic.textContent = "⏹"; setMsg("");
    try { r.start(); } catch (err) { setMsg("Couldn't start the microphone."); }
    return;
  }
  const cam = e.target.closest("[data-cam]");
  if (cam) return takePhoto(cam.closest(".item").dataset.k);
  const del = e.target.closest("[data-del]");
  if (del) return delPhoto(del.dataset.del);
  const img = e.target.closest("img[data-full]");
  if (img) window.open(img.dataset.full, "_blank", "noopener");
});

// ---- photos: the phone's own camera app (flash, focus, zoom) or the photo library ----
let camKey = null;
$("camIn").onchange = (e) => takeFiles(e);
function takePhoto(k) { camKey = k; $("camIn").click(); }
async function takeFiles(e) {
  const files = [...e.target.files]; e.target.value = ""; const k = camKey;
  for (const f of files) {
    // Evidence rule: only a photo taken just now. Nothing from the library or an older file.
    if (!f.lastModified || Math.abs(Date.now() - f.lastModified) > 3 * 60 * 1000) { setMsg("Photo refused: it was not taken just now. Inspection photos must be taken with the camera during the inspection."); break; }
    try {
      const bmp = await createImageBitmap(f);
      const c = document.createElement("canvas"); c.width = bmp.width; c.height = bmp.height; c.getContext("2d").drawImage(bmp, 0, 0);
      if (!(await addPhoto(k, c))) break;
    } catch (err) { setMsg("That photo could not be read (" + (err && err.message || "unsupported format") + "). Try again, or take it with the camera."); break; }
  }
}
async function addPhoto(k, canvas) {
  const max = 1600, sc = Math.min(1, max / Math.max(canvas.width, canvas.height));
  const out = document.createElement("canvas"); out.width = Math.round(canvas.width * sc); out.height = Math.round(canvas.height * sc);
  const g = out.getContext("2d"); g.drawImage(canvas, 0, 0, out.width, out.height);
  // The date, time, place and inspector are burned into the picture itself (the re-saved file carries no camera metadata).
  const taken = new Date();
  const stamp = taken.toLocaleString("en-US", { timeZone: "America/Chicago", year: "numeric", month: "numeric", day: "numeric", hour: "numeric", minute: "2-digit", second: "2-digit", timeZoneName: "short" })
    + " · " + prop.name + " " + label + " · " + k.split("|").map((x) => x.replace(/-/g, " ")).join(": ") + " · " + (meEmail || "inspector");
  const fs = Math.max(14, Math.round(out.width / 55)); g.font = "600 " + fs + "px sans-serif";
  g.fillStyle = "rgba(0,0,0,.65)"; g.fillRect(0, out.height - fs * 1.9, out.width, fs * 1.9);
  g.fillStyle = "#fff"; g.textBaseline = "middle"; g.fillText(stamp, fs * 0.5, out.height - fs * 0.95, out.width - fs);
  const blob = await new Promise((r) => out.toBlob(r, "image/jpeg", 0.8));
  if (!blob) { setMsg("Photo not saved: the picture could not be converted."); return false; }
  const path = `${pid}/${unit}/${id}/${slug(k)}-${Date.now()}.jpg`;
  $("saved").textContent = "Uploading photo…";
  let error = null;
  for (let n = 0; n < 3; n++) { ({ error } = await client.storage.from("inspections").upload(path, blob, { contentType: "image/jpeg" })); if (!error) break; await new Promise((r) => setTimeout(r, 800)); }
  if (error) { $("saved").textContent = "Photo NOT saved"; setMsg("Photo not saved: " + await errorText(error) + " Take it again."); return false; }
  const sha = [...new Uint8Array(await crypto.subtle.digest("SHA-256", await blob.arrayBuffer()))].map((b) => b.toString(16).padStart(2, "0")).join("");
  const cur = state.items[k] || {};
  state.items[k] = { ...cur, photos: [...(cur.photos || []), path], photoMeta: { ...(cur.photoMeta || {}), [path]: { taken_at: taken.toISOString(), sha256: sha, bytes: blob.size, by: meEmail || null } } };
  paintThumbs(itemEl(k)); touch(); setMsg("");
  return true;
}
async function delPhoto(path) {
  if (!confirm("Delete this photo?")) return;
  const el = [...box.querySelectorAll(".item")].find((i) => ((state.items[i.dataset.k] || {}).photos || []).includes(path));
  if (!el) return;
  const k = el.dataset.k;
  const meta = { ...(state.items[k].photoMeta || {}) }; delete meta[path];
  state.items[k] = { ...state.items[k], photos: state.items[k].photos.filter((p) => p !== path), photoMeta: meta };
  paintThumbs(el); touch();
  client.storage.from("inspections").remove([path]).catch(() => {});
}

// ---- history ----
async function loadHistory() {
  const { data } = await client.rpc("field_list_inspections", { p_property: pid, p_unit: unit });
  const list = data || [];
  $("hist").innerHTML = `<h2 style="margin-top:0">Past inspections</h2>` + (list.length ? list.map((i) =>
    `<a href="?p=${encodeURIComponent(pid)}&u=${encodeURIComponent(unit)}&id=${i.id}">${fmtDate(i.inspected_on)} · ${esc(PURPOSES[i.purpose] || "Routine")} · ${esc(i.status)} · ${esc(i.inspector)} · ${i.needs_repair} need repair${i.id === id ? " (this one)" : ""}</a>`).join("") : `<p class="sub">None yet.</p>`) +
    (reqId || submitted ? `<p><a class="btn" href="?p=${encodeURIComponent(pid)}&u=${encodeURIComponent(unit)}">Start a new inspection</a></p>` : "");
}

$("app").hidden = false; $("signin").hidden = true;
summarize(); loadHistory();
if (submitted) lock();
</script>
</body>
</html>
