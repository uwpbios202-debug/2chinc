<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Staff — 2nd Chance Housing</title>
<link rel="icon" href="/favicon.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700&display=swap">
<link rel="stylesheet" href="/assets/portal/portal.css">
<style>
.prop{margin-bottom:16px}.prop h2{margin:0}
.units{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:10px}
.u{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--panel)}
.u b{display:block;margin-bottom:4px}
.u a{display:block;color:var(--accent);font-size:.92rem;padding:1px 0}
.u .soon{display:block;color:var(--muted);font-size:.85rem;padding:1px 0}
.today-head{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.today-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.tgrp{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:12px 14px;display:grid;gap:2px;align-content:start}
.tgrp h3{margin:0 0 6px;font-size:.8rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.titem{display:grid;grid-template-columns:2.4em 1fr;gap:10px;align-items:baseline;padding:6px 4px;border-radius:4px;color:var(--fg);text-decoration:none}
.titem:hover{background:var(--accent-soft)}
.titem .n{font-weight:700;font-size:1.15rem;text-align:right;color:var(--accent)}
.titem.urgent .n{color:var(--bad)}
.titem .note{display:block;color:var(--muted);font-size:.85rem}
.titem.urgent .note{color:var(--bad)}
.allclear{border:1px solid var(--line);border-left:3px solid var(--ok);background:var(--ok-soft);border-radius:4px;padding:12px 16px}
</style>
</head>
<body>
<div class="appbar" data-nav="staff"><div class="appbar-in">
  <a class="org" href="/" style="color:inherit;text-decoration:none">2nd Chance Housing<span>Staff</span></a>
  <div class="row" id="userBar" hidden><span class="sub" id="who"></span><button class="linkbtn" type="button" id="signOutBtn">Sign out</button></div>
</div></div>
<main class="wrap">
  <section id="today" hidden></section>
  <header id="unitsHead"><h1>My units</h1><p class="lead">You see only the units assigned to you, and everything about those units: the tenant and owner views, vehicles, maintenance and inspections. Payments are view-only.</p></header>
  <div id="signin" class="narrow"></div>
  <div id="app" hidden></div>
</main>
<script type="module">
import { client, $, esc, signIn, signOut, errorText } from "/assets/portal/portal.js";
const who = await signIn($("signin"), { audience: "field" });
$("userBar").hidden = false; $("signOutBtn").onclick = signOut;
if (!["staff", "field"].includes(who.role)) {
  $("signin").hidden = false;
  $("signin").innerHTML = `<div class="panel"><p>This area is for staff. <a href="/">Back to the home page</a></p></div>`;
} else {
  const [{ properties }, mine, dueR, occR] = await Promise.all([fetch("/data/properties.json").then((r) => r.json()), client.rpc("field_my_units"), client.rpc("inspections_due"), client.rpc("field_unit_occupancy")]);
    const occ = occR.data || {};
    const due = {}; ((dueR.data || {}).units || []).forEach((x) => { due[x.property_id + "|" + x.unit] = x; });
    const badge = (pid, u) => { const x = due[pid + "|" + u]; if (!x) return ""; const t = { never: ["warn", "Never inspected"], overdue: ["warn", "Inspection overdue"], soon: ["", "Inspection due " + (x.due_on || "")], ok: ["", ""] }[x.state]; return t[1] ? `<span class="soon" style="${t[0] === "warn" ? "color:#9a5b00;font-weight:700" : ""}">${t[1]}</span>` : ""; };
  if (who.role === "staff") await showToday(dueR.data);
  if (mine.error) { $("signin").hidden = false; $("signin").innerHTML = `<div class="panel">${esc(await errorText(mine.error))}</div>`; }
  else {
    const all = mine.data.all, allowed = new Set((mine.data.units || []).map((x) => x.property_id + "|" + x.unit));
    const enc = encodeURIComponent;
    const html = properties.map((p) => {
      const units = (p.units.length ? p.units : ["_"]).filter((u) => all || allowed.has(p.id + "|" + u));
      if (!units.length) return "";
      return `<section class="panel prop"><h2>${esc(p.name)}</h2><div class="sub">${esc(p.address)}</div><div class="units">` +
        units.map((u) => `<div class="u"><b>${u === "_" ? "Whole property" : "Unit " + esc(u)}</b>${occ[u] === "owner" ? `<span class="soon" style="color:#1d3a5c;font-weight:700">Owner-occupied</span>` : occ[u] === "vacant" ? `<span class="soon">Vacant</span>` : ""}${badge(p.id, u)}
          <a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}"><b>Open unit</b></a>
          <a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}#tenant">Tenant view</a><a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}#owner">Owner view</a>
          <a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}#vehicles">Vehicles</a><a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}#maint">Maintenance</a><a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}#docs">Documents</a><a href="/staff/unit/?p=${enc(p.id)}&u=${enc(u)}#comms">Communications</a>
          <a href="/inspections/unit/?p=${enc(p.id)}&u=${enc(u)}">Inspection</a></div>`).join("") + `</div></section>`;
    }).join("");
    $("app").innerHTML = html || `<div class="panel"><p>No units are assigned to you yet. Ask the office to assign your units.</p></div>`;
    $("who").textContent = who.email || "";
    $("signin").hidden = true; $("app").hidden = false;
    if (who.role === "staff" && (await client.rpc("portal_is_admin")).data === true) { const a = document.createElement("a"); a.className = "linkbtn"; a.id = "viewAsLink"; a.href = "/staff/view-as/"; a.textContent = "View as…"; $("userBar").prepend(a); }
  }
}

// Office staff home: everything waiting on the office (staff_today), plus overdue inspections from this page's own data.
async function showToday(dueData) {
  const box = $("today");
  $("unitsHead").innerHTML = `<h2>All units</h2><p class="sub">Every unit, with the tenant and owner views, vehicles, maintenance and inspections.</p>`;
  const { data, error } = await client.rpc("staff_today");
  box.hidden = false;
  if (error) { box.innerHTML = `<div class="panel"><h1>Today</h1><p class="banner warn">${esc(await errorText(error))}</p></div>`; return; }
  const items = (data.items || []).filter((i) => i.n > 0);
  const late = ((dueData || {}).units || []).filter((x) => x.state === "overdue" || x.state === "never").length;
  if (late) items.push({ key: "inspections", grp: "Move-ins & move-outs", label: "Units overdue for inspection (or never inspected)", n: late, href: "/inspections/schedule/", urgent: false });
  const order = ["Leasing", "Move-ins & move-outs", "Residents", "Money", "ROCA1"];
  const groups = order.map((g) => [g, items.filter((i) => i.grp === g).sort((a, b) => b.urgent - a.urgent)]).filter(([, l]) => l.length);
  const when = new Date(data.as_of).toLocaleString("en-US", { weekday: "long", month: "long", day: "numeric", hour: "numeric", minute: "2-digit" });
  const urgentN = items.filter((i) => i.urgent).length;
  box.innerHTML = `<div class="today-head"><div><h1>Today</h1><p class="lead">${groups.length
      ? `${items.length} thing${items.length === 1 ? "" : "s"} waiting on the office${urgentN ? `, <b style="color:var(--bad)">${urgentN} need${urgentN === 1 ? "s" : ""} attention first</b>` : ""}.`
      : "Everything waiting on the office, in one place."}</p></div>
    <p class="sub">As of ${esc(when)} · <button class="linkbtn" type="button" id="todayRefresh">Refresh</button></p></div>` +
    (groups.length
      ? `<div class="today-grid">${groups.map(([g, l]) => `<section class="tgrp" aria-label="${esc(g)}"><h3>${esc(g)}</h3>${l.map((i) =>
          `<a class="titem${i.urgent ? " urgent" : ""}" href="${esc(i.href)}"><span class="n">${i.n}</span><span>${esc(i.label)}${i.note ? `<span class="note">${esc(i.note)}</span>` : ""}</span></a>`).join("")}</section>`).join("")}</div>`
      : `<div class="allclear"><b>Nothing is waiting on the office right now.</b> No applications to review, leases to sign, repairs, messages, payments to verify or deadlines coming up.</div>`);
  $("todayRefresh").onclick = async () => { const r = await client.rpc("inspections_due"); showToday(r.data); };
}
</script>
</body>
</html>
