<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Notes About Me | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="my">
<!-- Phase 8 (T8.5, D-35): no secret notes. Every note any organization writes about a visit, call or message with the person, with who wrote it.
     Notes never change; a correction is a new note. -->
<main id="main" class="mm-main">
  <div class="mm-read">
    <p class="mm-eyebrow"><a href="/mirror/my-mirror/">My Mirror</a> · <a href="/mirror/my-mirror/appointments/">My appointments</a></p>
    <h1>Notes about me</h1>
    <p class="mm-lead">Every note an organization writes about a visit, call or message with you, with who wrote it. There are no secret notes.</p>
  </div>
  <div id="mmBox"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice } from "/mirror/assets/mirror-ui.js?v=20261113h";

const KINDS = { visit: "Visit", call: "Call", message: "Message", meeting: "Meeting", other: "Other" };
const when = (t) => new Date(t).toLocaleString("en-US", { weekday: "short", month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });

await requireArea("my");
const box = /** @type {HTMLElement} */ (document.getElementById("mmBox"));
let N;
try { N = await rpc("mirror_interactions"); }
catch (e) { box.innerHTML = notice("urgent", `<p>${esc(e instanceof Error ? e.message : String(e))}</p>`); throw e; }
box.innerHTML = `${N.notes.length ? `<ul style="padding:0">${N.notes.map((x) => `<li class="mm-card" style="list-style:none;margin-bottom:var(--mm-space-3)">
    <p class="mm-muted mm-small" style="margin:0">${esc(when(x.at))} · ${esc(KINDS[x.kind] || x.kind)} · ${esc(x.organization)}, ${esc(x.by)}${x.private ? ' <span class="mm-tag mm-tag-info">private</span>' : ""}${x.corrected ? ' <span class="mm-tag">Corrected</span>' : ""}</p>
    ${x.corrects ? '<p class="mm-small mm-muted" style="margin:0">Correction of an earlier note</p>' : ""}
    <p style="margin:var(--mm-space-1) 0;white-space:pre-wrap">${esc(x.summary)}</p></li>`).join("")}</ul>`
  : notice("info", "<p>No notes yet.</p>")}
  <p class="mm-small mm-muted mm-read">A note in a private part of life is written only while you share that part with the organization. If you stop sharing it,
    they no longer see that note; it stays here for you. If a note is wrong, tell the organization: they add a correction, and both stay here.</p>`;
</script>
</body>
</html>
