<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>A Conversation | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
<style>
  .cg-quote { margin: var(--mm-space-2) 0 0; padding-left: var(--mm-space-3); border-left: 3px solid var(--mm-line); color: var(--mm-ink-2); font-style: italic; }
  .cg-find { display: flex; gap: var(--mm-space-3); align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }
  .cg-find + .cg-find { border-top: 1px solid var(--mm-line); padding-top: var(--mm-space-4); margin-top: var(--mm-space-4); }
  .cg-find h4 { margin: 0; font-size: 1.05rem; }
  .cg-share { display: inline-flex; gap: var(--mm-space-2); align-items: center; min-height: var(--mm-tap); font-weight: 700; cursor: pointer; }
  .cg-share input { width: 1.3rem; height: 1.3rem; accent-color: var(--mm-accent); }
  .cg-meta { font-size: var(--mm-small); color: var(--mm-ink-2); margin: var(--mm-space-1) 0 0; }
  .cg-q { font-family: var(--mm-serif); font-size: var(--mm-h3); font-weight: 600; line-height: 1.3; }
</style>
</head>
<body data-area="my">
<!-- T1.6 (D-21, D-29): the conversation guide, saved. The person answers, checks what was heard and chooses what one organization sees. -->
<main id="main" class="mm-main">
  <div class="mm-read">
    <p class="mm-eyebrow"><a href="/mirror/my-mirror/">My Mirror</a></p>
    <h1>A conversation</h1>
    <p class="mm-lead">A few open questions about how things are going. Speak or type. You'll see what we heard, fix anything that's wrong,
      and choose what your coordinator or Navigator may see.</p>
  </div>
  <div class="mm-read" id="cgApp"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { QUESTIONS, analyse, urgentIn, URGENT } from "/mirror/assets/mirror-listen.js?v=20261113c";
import { voiceInput, readAll } from "/mirror/assets/mirror-voice.js?v=20261113c";
import { esc, notice, countBar, toast } from "/mirror/assets/mirror-ui.js?v=20261113h";

await requireArea("my");
const app = /** @type {HTMLElement} */ (document.getElementById("cgApp"));
/** @type {any} */ let data;
/** @type {any} */ let cur;                 // the conversation on screen
/** @type {Record<string,string>} */ let answers = {};
let at = 0;
/** @type {any[]} */ let findings = [];
/** @type {Set<string>} */ let shared = new Set();
const fid = (/** @type {any} */ f) => f.kind + ":" + f.key;
const day = (/** @type {string} */ d) => new Date(d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const STATUS = { identified: "Noted", planning: "Planning", in_progress: "Working on it", obtained: "Got it", verified: "Confirmed", no_longer_needed: "No longer needed" };
const GROUPS = [["urgent", "Needs help right away"], ["help", "Help with housing and money"], ["other", "Other things you mentioned"],
  ["pop", "About you (helps find programs meant for you)"]];

async function load() {
  try { data = await rpc("mirror_conversation_mine"); } catch (e) { app.innerHTML = notice("caution", `<p>${esc(e.message)}</p>`); return; }
  home();
}

// ------------------------------------------------------------------ home: the open conversation, or the last one
function home() {
  const open = data.conversations.find((c) => c.status === "open");
  const past = data.conversations.filter((c) => c.status !== "open");
  app.innerHTML = `
    ${open ? `<div class="mm-card" style="margin-bottom:var(--mm-space-5)">
        <h2 style="margin-top:0">Your conversation in progress</h2>
        <p>${Object.keys(open.answers).length} of ${QUESTIONS.length} questions answered. Your answers are saved as you go and only you can see them.</p>
        <div class="mm-row"><button class="mm-btn" type="button" id="cgGo">Keep going</button>
          <button class="mm-btn mm-btn-quiet" type="button" id="cgThrow">Throw this one away</button></div></div>`
      : `<div class="mm-card" style="margin-bottom:var(--mm-space-5)">
        <h2 style="margin-top:0">How it works</h2>
        <ol><li>${QUESTIONS.length} open questions, one at a time. Speak or type; skip any of them. Only you see your answers.</li>
          <li><strong>What we heard:</strong> you see what the page found in your words, remove anything that's wrong, and tick what may be shared.
            Private topics stay with you unless you tick them.</li>
          <li>You choose <strong>one</strong> organization you work with to share it with, or keep it for yourself. You can take it back later.</li></ol>
        <button class="mm-btn" type="button" id="cgNew">Start a conversation</button></div>`}
    ${past.length ? `<h2>Earlier conversations</h2>${past.map(pastCard).join("")}` : ""}`;
  const go = app.querySelector("#cgGo");
  if (go) go.addEventListener("click", () => begin(open));
  const thr = app.querySelector("#cgThrow");
  if (thr) thr.addEventListener("click", async () => {
    if (thr.dataset.sure !== "1") { thr.dataset.sure = "1"; thr.textContent = "Press again to throw it away"; return; }
    try { await rpc("mirror_conversation_discard", { p_conversation: open.id }); toast("Thrown away."); load(); } catch (e) { toast(e.message); }
  });
  const nw = app.querySelector("#cgNew");
  if (nw) nw.addEventListener("click", async () => {
    try { await rpc("mirror_conversation_start"); data = await rpc("mirror_conversation_mine"); begin(data.conversations.find((c) => c.status === "open")); } catch (e) { toast(e.message); }
  });
  past.forEach(wirePast);
}

function pastCard(/** @type {any} */ c) {
  const sharedN = c.findings.filter((f) => f.shared).length;
  return `<section class="mm-card" style="margin-bottom:var(--mm-space-4)" data-conv="${esc(c.id)}">
    <h3 style="margin-top:0">${esc(day(c.created_at))}</h3>
    <p>${c.status === "shared" ? `Shared with <strong>${esc(c.organization)}</strong> on ${esc(day(c.shared_at))}: ${sharedN} of ${c.findings.length} item${c.findings.length === 1 ? "" : "s"}.`
      : "Kept for yourself. Nothing from it is shared."}</p>
    ${c.findings.map((f) => `<div class="cg-find"><div style="flex:1 1 16rem">
        <h4>${esc(f.label)} ${f.private ? '<span class="mm-tag mm-tag-info">Private</span>' : ""} ${f.shared ? '<span class="mm-tag mm-tag-ok">Shared</span>' : ""}</h4>
        ${f.quotes.map((x) => `<p class="cg-quote">"${esc(x.words)}"</p>`).join("")}
        ${f.need ? `<p class="cg-meta">On your needs list: ${esc(STATUS[f.need.status] || f.need.status)}</p>` : ""}
        ${f.referrals.map((r) => `<p class="cg-meta">Referred to ${esc(r.org_name)}${r.program_name ? " (" + esc(r.program_name) + ")" : ""} on ${esc(day(r.at))}</p>`).join("")}
      </div>${f.dimension && !f.need ? `<button class="mm-btn mm-btn-quiet" type="button" data-need="${esc(f.id)}">Add to my needs</button>` : ""}</div>`).join("")}
    <div class="mm-row" style="margin-top:var(--mm-space-4)">
      <button class="mm-btn mm-btn-secondary" type="button" data-change>Change what's shared</button>
      ${c.status === "shared" ? '<button class="mm-btn mm-btn-quiet" type="button" data-back>Take it back</button>' : ""}
    </div></section>`;
}

function wirePast(/** @type {any} */ c) {
  const card = /** @type {HTMLElement} */ (app.querySelector(`[data-conv="${c.id}"]`));
  card.querySelectorAll("[data-need]").forEach((b) => b.addEventListener("click", async () => {
    try { await rpc("mirror_conversation_need", { p_finding: b.getAttribute("data-need") }); toast("Added to your needs."); load(); } catch (e) { toast(e.message); }
  }));
  card.querySelector("[data-change]").addEventListener("click", () => {
    cur = c; answers = { ...c.answers };
    findings = c.findings.map((f) => ({ ...f }));
    shared = new Set(c.findings.filter((f) => f.shared).map(fid));
    drawHeard(c.organization_id);
  });
  const back = card.querySelector("[data-back]");
  if (back) back.addEventListener("click", async () => {
    try { await rpc("mirror_conversation_share", { p_conversation: c.id, p_org: null, p_findings: payload(c.findings, new Set()) });
      toast("Taken back. Nothing from it is shared now."); load(); } catch (e) { toast(e.message); }
  });
}

// ------------------------------------------------------------------ the questions (saved as you go)
function begin(/** @type {any} */ c) {
  cur = c; answers = { ...c.answers };
  at = QUESTIONS.findIndex((q) => !answers[q.id]);
  if (at < 0) at = 0;
  ask();
}

function urgentBox(/** @type {string[]} */ keys) {
  if (!keys.length) return "";
  return notice("urgent", `<p><strong>Help is available right now.</strong></p><ul>${[...new Set(keys)].map((k) => `<li>${esc(URGENT[k].help)}</li>`).join("")}</ul><p>You can keep going here too.</p>`);
}

function ask() {
  const q = QUESTIONS[at];
  app.innerHTML = `
    ${countBar(at, QUESTIONS.length, "questions")}
    <form class="mm-card" id="cgForm" ${q.private ? "data-mm-sensitive" : ""}>
      <div class="mm-field">
        <label class="cg-q" for="cgA" data-mm-read>${esc(q.text)}</label>
        ${q.private ? '<span class="mm-tag mm-tag-info">Private</span> ' : ""}<span class="mm-hint">${esc(q.hint || "Say it in your own words. There are no wrong answers. Only you see this answer.")}</span>
        <textarea class="mm-textarea" id="cgA" rows="5" maxlength="4000">${esc(answers[q.id] || "")}</textarea>
      </div>
      <div id="cgUrgent" aria-live="assertive"></div>
      <div class="mm-row">
        <button class="mm-btn" type="submit">${at === QUESTIONS.length - 1 ? "Finish" : "Next"}</button>
        ${at > 0 ? '<button class="mm-btn mm-btn-secondary" type="button" id="cgBack">Back</button>' : ""}
        <button class="mm-btn mm-btn-quiet" type="button" id="cgSkip">Skip this question</button>
        <button class="mm-btn mm-btn-quiet" type="button" id="cgLater">Finish later</button>
      </div>
    </form>`;
  const ta = /** @type {HTMLTextAreaElement} */ (app.querySelector("#cgA"));
  voiceInput(ta); readAll(app);
  const urg = /** @type {HTMLElement} */ (app.querySelector("#cgUrgent"));
  const check = () => { urg.innerHTML = urgentBox(urgentIn(ta.value)); };
  ta.addEventListener("input", check); check();
  /** Saves this answer; returns false (and says why) when it could not be saved. */
  const save = async (/** @type {string} */ text) => {
    try { await rpc("mirror_conversation_answer_save", { p_conversation: cur.id, p_question: q.id, p_answer: text }); answers[q.id] = text.trim(); return true; }
    catch (e) { toast(e.message); return false; }
  };
  /** @type {HTMLFormElement} */ (app.querySelector("#cgForm")).onsubmit = async (e) => { e.preventDefault(); if (await save(ta.value)) next(); };
  /** @type {HTMLElement} */ (app.querySelector("#cgSkip")).onclick = async () => { if (await save("")) next(); };
  /** @type {HTMLElement} */ (app.querySelector("#cgLater")).onclick = async () => { if (await save(ta.value)) load(); };
  const back = /** @type {HTMLElement|null} */ (app.querySelector("#cgBack"));
  if (back) back.onclick = async () => { if (await save(ta.value)) { at--; ask(); } };
  ta.focus();
}

function next() { if (at < QUESTIONS.length - 1) { at++; ask(); } else heard(); }

// ------------------------------------------------------------------ what we heard, and the person's choices
function heard() {
  findings = analyse(answers, data.phrases);
  shared = new Set(findings.filter((f) => !f.private).map(fid));
  drawHeard(null);
}

function payload(/** @type {any[]} */ list, /** @type {Set<string>} */ ticks) {
  return list.map((f) => ({ kind: f.kind, key: f.key, quotes: f.quotes, shared: ticks.has(fid(f)) }));
}

function drawHeard(/** @type {string|null} */ orgNow) {
  const orgs = data.organizations;
  const urgentKeys = findings.filter((f) => f.kind === "urgent").map((f) => f.urgent || f.key);
  app.innerHTML = `
    <h2>Here's what we heard</h2>
    <p>Check each one. Remove anything that isn't right. Tick what may be shared; private topics are not shared unless you tick them.</p>
    ${urgentBox(urgentKeys)}
    ${findings.length ? GROUPS.map(([k, title]) => {
      const list = findings.filter((f) => f.kind === k);
      if (!list.length) return "";
      return `<section class="mm-card" style="margin-bottom:var(--mm-space-4)"><h3>${esc(title)}</h3>${list.map((f) => `
        <div class="cg-find">
          <div style="flex:1 1 16rem">
            <h4>${esc(f.label)} ${f.private ? '<span class="mm-tag mm-tag-info">Private</span>' : ""}</h4>
            ${f.quotes.map((x) => `<p class="cg-quote">"${esc(x.words)}"</p>`).join("")}
          </div>
          <div class="mm-row">
            <label class="cg-share"><input type="checkbox" data-share="${esc(fid(f))}" ${shared.has(fid(f)) ? "checked" : ""}> Share</label>
            ${f.need || (f.referrals && f.referrals.length) ? "" : `<button type="button" class="mm-btn mm-btn-quiet" data-drop="${esc(fid(f))}">Not right</button>`}
          </div>
        </div>`).join("")}</section>`;
    }).join("") : notice("info", "<p>Nothing was found in these answers. You can still keep them, and talk them through with your coordinator or Navigator.</p>")}
    <div class="mm-card">
      ${orgs.length ? `<div class="mm-field"><label for="cgOrg">Share with</label>
          <select class="mm-select" id="cgOrg">${orgs.map((o) => `<option value="${esc(o.id)}" ${o.id === orgNow ? "selected" : ""}>${esc(o.name)}</option>`).join("")}</select>
          <span class="mm-hint">Only the ticked items go to this one organization. They never see your answers themselves.</span></div>`
        : "<p>You aren't working with an organization yet, so this is kept for you.</p>"}
      <div class="mm-row">
        ${orgs.length ? '<button class="mm-btn" type="button" id="cgSend">Share the ticked items</button>' : ""}
        <button class="mm-btn mm-btn-secondary" type="button" id="cgKeep">Keep it for myself</button>
        ${cur.status === "open" ? '<button class="mm-btn mm-btn-quiet" type="button" id="cgEdit">Change my answers</button>' : ""}
      </div>
      <div id="cgMsg" aria-live="assertive"></div>
    </div>`;
  app.querySelectorAll("[data-share]").forEach((c) => c.addEventListener("change", () => {
    const k = /** @type {string} */ (c.getAttribute("data-share"));
    if (/** @type {HTMLInputElement} */ (c).checked) shared.add(k); else shared.delete(k);
  }));
  app.querySelectorAll("[data-drop]").forEach((b) => b.addEventListener("click", () => {
    const k = b.getAttribute("data-drop"); findings = findings.filter((f) => fid(f) !== k); shared.delete(/** @type {string} */ (k)); drawHeard(orgNow);
  }));
  const edit = app.querySelector("#cgEdit");
  if (edit) edit.addEventListener("click", () => { at = 0; ask(); });
  const finish = async (/** @type {string|null} */ org) => {
    try {
      await rpc("mirror_conversation_share", { p_conversation: cur.id, p_org: org, p_findings: payload(findings, org ? shared : new Set()) });
      toast(org ? "Shared." : "Kept for you. Nothing is shared.");
      load();
    } catch (e) { /** @type {HTMLElement} */ (app.querySelector("#cgMsg")).innerHTML = notice("caution", `<p>${esc(e.message)}</p>`); }
  };
  const send = app.querySelector("#cgSend");
  if (send) send.addEventListener("click", () => finish(/** @type {HTMLSelectElement} */ (app.querySelector("#cgOrg")).value));
  /** @type {HTMLElement} */ (app.querySelector("#cgKeep")).addEventListener("click", () => finish(null));
  /** @type {HTMLElement} */ (app.querySelector("h2")).scrollIntoView();
}

load();
</script>
</body>
</html>
