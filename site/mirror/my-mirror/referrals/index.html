<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>My Referrals | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="my">
<!-- Phase 7 (T7.3): referrals with typed consent. The person agrees here, on their own page, to exactly what is shared; an organization they
     work with then makes the referral through the housing resource directory (CHPMS). The person can say no or take consent back. -->
<main id="main" class="mm-main">
  <div class="mm-read">
    <p class="mm-eyebrow"><a href="/mirror/my-mirror/">My Mirror</a> · <a href="/mirror/my-mirror/resources/">Help I could get</a></p>
    <h1>My referrals</h1>
    <p class="mm-lead">A referral means an organization you work with tells a program about you, so the program can contact you. Nothing is shared until you agree here.</p>
  </div>
  <div id="mmBox"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice, toast } from "/mirror/assets/mirror-ui.js?v=20261113h";
import { voiceAll } from "/mirror/assets/mirror-voice.js?v=20261113c";

const STATUS = {
  awaiting_consent: "Waiting for your answer",
  consented: "You agreed. Waiting for the organization to make the referral",
  referred: "Referred",
  declined: "You said no",
  withdrawn: "You took it back",
};
const DIRECTORY = {
  new: "recorded, not sent to the program yet",
  sent: "sent to the program",
  in_process: "the program is working on it",
  approved: "approved by the program",
  denied: "the program said no",
  closed: "closed",
  withdrawn: "withdrawn",
};
const msg = (e) => (e instanceof Error ? e.message : String(e));
const day = (d) => (d ? new Date(d.length === 10 ? d + "T12:00:00" : d).toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" }) : "");

await requireArea("my");
const box = /** @type {HTMLElement} */ (document.getElementById("mmBox"));
/** @type {any} */ let data = null;

async function load(note = "") {
  try { data = await rpc("mirror_referrals"); }
  catch (e) { box.innerHTML = notice("urgent", `<p>${esc(msg(e))}</p>`); return; }
  draw(note);
}

/** The exact words the person agrees to; the database builds and keeps the same sentence (mirror.referral_consent_words).
 * @param {any} x @param {{email:boolean, phone:string, household:string}} v */
function words(x, v) {
  return "I agree that " + x.organization + " may refer me to " + x.org_name + (x.program_name ? " (" + x.program_name + ")" : "")
    + " and share with them my name" + (v.email ? ", my email" : "") + (v.phone.trim() ? ", my phone" : "")
    + (v.household ? ", how many people live with me" : "")
    + (x.help_needed.length ? ", the help I need (" + x.help_needed.join(", ") + ")" : "")
    + (x.note_to_program ? ' and this note: "' + x.note_to_program + '"' : "")
    + ". Nothing else from my Mirror is shared. I can take this back at any time.";
}

/** @param {any} x */
function consentForm(x) {
  const id = esc(x.id);
  return `<form data-consent novalidate style="margin-top:var(--mm-space-3)">
    <h3 style="margin-top:0">What would be shared</h3>
    <div class="mm-field"><label for="fn-${id}">Your first name</label><input class="mm-input" id="fn-${id}" maxlength="80" autocomplete="given-name"></div>
    <div class="mm-field"><label for="ln-${id}">Your last name</label><input class="mm-input" id="ln-${id}" maxlength="80" autocomplete="family-name"></div>
    <label class="mm-choice"><input type="checkbox" id="em-${id}" checked> Share my email so the program can write to me</label>
    <div class="mm-field"><label for="ph-${id}">Phone the program may call <span class="mm-muted">(optional if you share your email)</span></label>
      <input class="mm-input" id="ph-${id}" maxlength="40" inputmode="tel" autocomplete="tel"></div>
    <div class="mm-field"><label for="hh-${id}">How many people live with you, counting you <span class="mm-muted">(optional)</span></label>
      <input class="mm-input" id="hh-${id}" type="number" min="1" max="20" inputmode="numeric" style="max-width:8rem"></div>
    <div class="mm-card" style="background:var(--mm-surface-2, transparent)"><p class="mm-small" style="margin:0"><strong>You are agreeing to:</strong></p>
      <p data-words style="margin:var(--mm-space-2) 0 0"></p></div>
    <div class="mm-field"><label for="cn-${id}">To agree, type your first and last name</label>
      <span class="mm-hint" id="cnh-${id}">Typing your name is your signature for this referral only.</span>
      <input class="mm-input" id="cn-${id}" maxlength="200" aria-describedby="cnh-${id}" autocomplete="off"></div>
    <div data-err aria-live="assertive"></div>
    <div class="mm-row" style="gap:var(--mm-space-2)"><button class="mm-btn" type="submit">I agree</button>
      <button class="mm-btn mm-btn-quiet" type="button" data-no>No, don't refer me</button></div>
  </form>`;
}

/** @param {any} x */
function item(x) {
  const dir = x.directory_status ? ` · ${esc(DIRECTORY[x.directory_status] || x.directory_status)}` : "";
  return `<li class="mm-card" style="margin-bottom:var(--mm-space-4);list-style:none" data-ref="${esc(x.id)}">
    <strong>${esc(x.org_name)}</strong>${x.program_name ? ` <span class="mm-muted">(${esc(x.program_name)})</span>` : ""}
    ${x.private ? ' <span class="mm-tag mm-tag-info">Private</span>' : ""}
    <p class="mm-small" style="margin:var(--mm-space-2) 0 0"><span class="mm-tag${x.status === "referred" ? " mm-tag-ok" : x.status === "awaiting_consent" ? " mm-tag-suggested" : ""}">${esc(STATUS[x.status] || x.status)}</span>${x.status === "referred" ? dir : ""}</p>
    <p class="mm-small mm-muted" style="margin:var(--mm-space-2) 0 0">Through ${esc(x.organization)}${x.proposed_by_role === "self" ? ", at your request" : ", suggested by your coordinator"}${x.ref_no ? ` · directory referral #${esc(x.ref_no)}` : ""}</p>
    ${x.consent_at ? `<details style="margin-top:var(--mm-space-2)"><summary class="mm-small">What you agreed to on ${esc(day(x.consent_at))}</summary><p class="mm-small">${esc(x.consent_text)}</p><p class="mm-small mm-muted">Typed: ${esc(x.consent_name)}</p></details>` : ""}
    ${x.status === "awaiting_consent" ? consentForm(x) : ""}
    ${x.status === "consented" || x.status === "referred" ? `<p style="margin:var(--mm-space-3) 0 0"><button class="mm-btn mm-btn-quiet" type="button" data-back>Take back my consent</button></p>` : ""}
    <div data-more></div>
  </li>`;
}

function draw(note) {
  const L = data.referrals;
  box.innerHTML = `${note}<div class="mm-read">
    ${notice("info", `<p>To ask for a referral, open <a href="/mirror/my-mirror/resources/">Help I could get</a> and choose "Ask for a referral" on a program on your list.
      An organization you work with may also suggest one; it shows here and waits for your answer.</p>`)}
    ${L.length ? `<ul style="padding:0">${L.map(item).join("")}</ul>` : '<p class="mm-muted">No referrals yet.</p>'}</div>`;
  voiceAll(box);
  wire();
}

function wire() {
  box.querySelectorAll("[data-ref]").forEach((el) => {
    const id = /** @type {HTMLElement} */ (el).dataset.ref || "";
    const x = data.referrals.find((y) => y.id === id);
    const more = /** @type {HTMLElement} */ (el.querySelector("[data-more]"));
    const f = /** @type {HTMLFormElement|null} */ (el.querySelector("[data-consent]"));
    if (f) {
      const g = (/** @type {string} */ k) => /** @type {HTMLInputElement} */ (f.querySelector("#" + k + "-" + CSS.escape(id)));
      const vals = () => ({ email: g("em").checked, phone: g("ph").value, household: g("hh").value });
      const show = () => { /** @type {HTMLElement} */ (f.querySelector("[data-words]")).textContent = words(x, vals()); };
      f.addEventListener("input", show); f.addEventListener("change", show); show();
      f.addEventListener("submit", async (e) => {
        e.preventDefault();
        const err = /** @type {HTMLElement} */ (f.querySelector("[data-err]"));
        const v = vals();
        try {
          await rpc("mirror_referral_consent", { p_id: id, p_first: g("fn").value, p_last: g("ln").value, p_share_email: v.email,
            p_phone: v.phone || null, p_household: v.household ? Number(v.household) : null, p_consent_name: g("cn").value });
          toast("Thank you. The organization can now make the referral."); load();
        } catch (err2) { err.innerHTML = notice("urgent", `<p>${esc(msg(err2))}</p>`); }
      });
      f.querySelector("[data-no]")?.addEventListener("click", async () => {
        try { await rpc("mirror_referral_decline", { p_id: id }); toast("Nothing was shared."); load(); } catch (err2) { toast(msg(err2)); }
      });
    }
    el.querySelector("[data-back]")?.addEventListener("click", () => {
      more.innerHTML = `<p class="mm-small" style="margin-top:var(--mm-space-2)">Take back your consent for ${esc(x.org_name)}?
        ${x.status === "referred" ? "If it has not reached the program yet, it is stopped; if it has, whoever made it is told to let the program know." : "Nothing has been shared yet."}
        <button class="mm-btn mm-btn-secondary" type="button" data-yes>Yes, take it back</button>
        <button class="mm-btn mm-btn-quiet" type="button" data-keep>Keep it</button></p>`;
      more.querySelector("[data-keep]")?.addEventListener("click", () => { more.innerHTML = ""; });
      more.querySelector("[data-yes]")?.addEventListener("click", async () => {
        try { await rpc("mirror_referral_withdraw", { p_id: id }); toast("Consent taken back."); load(); } catch (err2) { toast(msg(err2)); }
      });
    });
  });
}

load();
</script>
</body>
</html>
