<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Areas of Life | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="my">
<main id="main" class="mm-main">
  <div id="mmLife"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice, countBar } from "/mirror/assets/mirror-ui.js?v=20261113h";
import { lifeHref } from "/mirror/assets/reflection-page.js?v=20261113p";
await requireArea("my");
const box = document.getElementById("mmLife");
let sets = [];
try { sets = await rpc("mirror_sets", { p_kind: "dimension" }); } catch (e) { box.innerHTML = notice("urgent", "<p>" + esc(e.message) + "</p>"); }
const done = sets.reduce((n, s) => n + s.answered, 0), total = sets.reduce((n, s) => n + s.questions, 0);
box.innerHTML = `
  <div class="mm-read">
    <p class="mm-eyebrow"><a href="/mirror/my-mirror/">My Mirror</a></p>
    <h1>Fifteen areas of your life</h1>
    <p class="mm-lead">Housing is one part of a life, not the whole of it. Start with whichever area is on your mind today. A blank never counts against you.</p>
  </div>
  ${countBar(done, total, "questions answered so far")}
  <div class="mm-grid">${sets.map((s, i) => `<a class="mm-card" href="${lifeHref(s.dimension)}">
    <div class="mm-card-num">${i + 1}</div><h3>${esc(s.title)}</h3><p class="mm-muted">${esc(s.intro || "")}</p>
    ${countBar(s.answered, s.questions, "answered")}</a>`).join("")}</div>`;
</script>
</body>
</html>
