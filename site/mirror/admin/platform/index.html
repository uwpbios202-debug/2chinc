<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Platform Overview | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="admin">
<main id="main" class="mm-main">
  <p class="mm-eyebrow"><a href="/mirror/admin/">Administration</a></p>
  <h1>Platform overview</h1>
  <p class="mm-lead">For 2nd Chance platform admins: users, roles, sharing, the audit log of every organization, email, settings, security and data.
    Counts and rules only: no one's name or answers. Read only.</p>
  <div id="mmPlat"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
// P2-08 (11/13/2026, D-40): the site map's remaining /mirror/admin/ sections on one page: users, roles, teams, consent, audit (P2-07 platform
// half), email, configuration, security, data management. mirror_platform_overview and mirror_platform_audit (platform admins only; each
// read is logged). Settings, rules and the sign-in switch are changed by Stephen's decision, not here.
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice, toast } from "/mirror/assets/mirror-ui.js?v=20261113h";

const ROLE = { org_admin: "Organization admin", coordinator: "Coordinator", volunteer: "Volunteer" };
const KIND = { nonprofit: "Nonprofit", agency: "Agency", navigator: "Navigator business", other: "Other" };
const TOPIC = { general: "Everyday", health: "Physical health", mental_health: "Feelings and mental health", safety: "Safety", legal: "ID, papers and legal",
  immigration: "Immigration", financial: "Money", documents: "Documents", safety_flag: "Safety-mode note", audit: "Audit log", organization: "The organization (members, services)",
  workspace: "Work with the organization's people", confirm: "Confirm a need met or a milestone" };
const ACCESS = { view: "can see", edit: "can see and change" };
const when = (t) => new Date(t).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
const day = (d) => new Date(d + "T12:00:00").toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const table = (cap, heads, rows) => `<div class="mm-table-wrap mm-stack"><table class="mm-table"><caption class="mm-sr">${esc(cap)}</caption>
  <thead><tr>${heads.map((h) => `<th scope="col"${/^#/.test(h) ? ' class="mm-num"' : ""}>${esc(h.replace(/^#/, ""))}</th>`).join("")}</tr></thead>
  <tbody>${rows.map((r) => `<tr>${r.map((c, i) => `<td${/^#/.test(heads[i]) ? ' class="mm-num"' : ""} data-label="${esc(heads[i].replace(/^#/, ""))}">${c}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;

await requireArea("workspace");
const box = document.getElementById("mmPlat");
let O;
try { O = await rpc("mirror_platform_overview"); }
catch (e) { box.innerHTML = notice("caution", `<p>${esc(e.message)}</p><p><a href="/mirror/admin/">Back to Organizations and members</a></p>`); throw e; }

// role rules as a table: one row per role and topic, what each may do
const roles = [...new Set(O.roles.map((r) => r.role))];
const cats = [...new Set(O.roles.map((r) => r.category))];
const may = (role, cat) => O.roles.filter((r) => r.role === role && r.category === cat).map((r) => r.action === "edit" ? "change" : "see").join(", ");
const P = O.people;
const signin = (O.settings.find((s) => s.key === "mirror_signin_enabled") || {}).value || "not set";

box.innerHTML = `
  <nav aria-label="On this page" class="mm-small mm-row" style="gap:var(--mm-space-3);margin-bottom:var(--mm-space-4)">
    <a href="#pUsers">Users</a><a href="#pOrgs">Organizations</a><a href="#pRoles">Roles</a><a href="#pTeams">Teams</a><a href="#pShare">Sharing</a>
    <a href="#pAudit">Audit log</a><a href="#pEmail">Email</a><a href="#pConfig">Configuration</a><a href="#pSecurity">Security</a><a href="#pData">Data</a></nav>

  <section id="pUsers"><h2>Users</h2>
    ${table("People in the Mirror", ["What", "#Count"], [["People with a Mirror", P.total], ["With their own sign-in email", P.with_sign_in_email],
      ["In safety mode", P.safety_mode], ["Asked to delete their Mirror", P.deletion_requested]].map(([a, b]) => [esc(a), esc(b)]))}
    ${table("Organization members", ["Role", "#Active", "#With an authenticator"], O.members.map((m) => [esc(ROLE[m.role] || m.role), esc(m.active), esc(m.with_authenticator)]))}
    <p class="mm-small mm-muted">Members are added on <a href="/mirror/admin/">Organizations and members</a>. A member needs an authenticator before opening anyone's Mirror (D-24).</p></section>

  <section id="pOrgs"><h2>Organizations</h2>
    ${table("Organizations", ["Organization", "Kind", "#Members", "#People", "Open"], O.organizations.map((o) => [esc(o.name), esc(KIND[o.kind] || o.kind), esc(o.members), esc(o.people), o.active ? "Yes" : "Closed"]))}</section>

  <section id="pRoles"><h2>Roles</h2>
    <p class="mm-read">What each role may do, topic by topic, when the person shares that topic. Read only: these rules are one table in the database (role_permissions).</p>
    ${table("What each role may do", ["Topic", ...roles.map((r) => ROLE[r] || r)], cats.map((c) => [esc(TOPIC[c] || c), ...roles.map((r) => esc(may(r, c)) || '<span class="mm-muted">no</span>')]))}</section>

  <section id="pTeams"><h2>Teams</h2>
    <p class="mm-read">There are no teams inside an organization: each organization is one team, and its members list is the team list (D-40).
      A Housing Navigator's business is its own organization (D-20).</p></section>

  <section id="pShare"><h2>Sharing</h2>
    <p class="mm-read">How many people share each topic with each organization today. Counts only.</p>
    ${O.sharing.length ? table("Sharing choices", ["Organization", "Topic", "Access", "#People", "#Ending in 30 days"],
      O.sharing.map((s) => [esc(s.organization), esc(TOPIC[s.topic] || s.topic), esc(ACCESS[s.access] || s.access), esc(s.people), esc(s.ending_in_30_days)])) : '<p class="mm-muted">No one shares anything yet.</p>'}</section>

  <section id="pAudit"><h2>Audit log, every organization</h2>
    <p class="mm-read">Who looked and changed what. Members by name; a person never by name, only a short code that stays the same for the same person.
      Reading this log is itself logged.</p>
    <div class="mm-field" style="max-width:24rem"><label for="aOrg">Organization</label><select class="mm-select" id="aOrg"><option value="">All organizations</option>
      ${O.organizations.map((o, i) => `<option value="${i}">${esc(o.name)}</option>`).join("")}</select></div>
    <div id="aBox"><p class="mm-muted">Loading…</p></div></section>

  <section id="pEmail"><h2>Email</h2>
    <p><a class="mm-btn mm-btn-secondary" href="/mirror/admin/email/">Mirror emails: exact words, and turning each kind on</a></p>
    <p class="mm-read">No Mirror email is sent before Phase 9. Sign-in codes and security notices always go; the three choices below are on unless a person turns them off,
      and safety mode stops all three (D-25).</p>
    ${table("Email choices", ["Kind of email", "#People who turned it off"], [["Updates on referrals", O.email.turned_off.referral], ["Appointment reminders", O.email.turned_off.appointment],
      ["Reminders about the plan", O.email.turned_off.action]].map(([a, b]) => [esc(a), esc(b)]))}
    ${O.email.outbox.length ? table("Mirror emails in the outbox", ["Kind", "#Waiting", "#Sent", "#Failed"], O.email.outbox.map((x) => [esc(x.kind), esc(x.waiting), esc(x.sent), esc(x.failed)]))
      : '<p class="mm-muted">No Mirror email has been queued.</p>'}</section>

  <section id="pConfig"><h2>Configuration</h2>
    ${table("Mirror settings", ["Setting", "Value"], O.settings.map((s) => [esc(s.key), esc(s.value)]))}
    <p class="mm-small mm-muted">Mirror sign-in is <strong>${esc(signin)}</strong>. It stays off until all phases are built and Stephen says go (D-22, D-28). Settings change only by Stephen's decision.</p></section>

  <section id="pSecurity"><h2>Security</h2>
    <ul class="mm-read">
      <li>Every organization member needs an authenticator app code before opening anyone's Mirror (D-24). People sign in with an emailed code only.</li>
      <li>Every look at a private topic is written to the audit log, and the person sees it under "Who looked".</li>
      <li>Mirror sessions follow the site's sign-out rules (D-22). The audit log can't be emptied or edited.</li>
      <li>Organization admins can reset a member's authenticator (P2-11), with a reason; it's in the audit log.</li></ul></section>

  <section id="pData"><h2>Data management</h2>
    <p class="mm-read">People who asked to delete their Mirror. After 30 days everything is deleted (D-18). Dates and a code only.</p>
    ${O.deletions.length ? table("Deletion requests", ["Person", "Asked on", "Delete on"], O.deletions.map((d) => [esc("Person " + d.code), esc(day(d.requested_on)),
      esc(day(d.due_on)) + (d.due_on <= O.today ? ' <span class="mm-tag mm-tag-urgent">Due</span>' : "")])) : '<p class="mm-muted">No deletion requests.</p>'}
    <p class="mm-small mm-muted">The deletion runs by itself every morning (job mirror-deletions, D-45). Each person can download everything from their own Settings.</p></section>

  <section id="pHide"><h2>Hide a Mirror now (someone in danger)</h2>
    <form class="mm-card mm-read" id="hForm" novalidate>
      <p class="mm-hint">When a person calls because they may be in danger: confirm it is them (phone, video or in person), then hide their Mirror from every
        organization at once. Nothing is deleted unless they also ask for that. Only they can show it again, in their Settings.</p>
      <div class="mm-field"><label for="hEmail">Their sign-in email</label><input class="mm-input" type="email" id="hEmail" autocomplete="off" maxlength="254" data-mm-no-voice></div>
      <div class="mm-field"><label for="hWhy">Why</label><input class="mm-input" id="hWhy" maxlength="300"></div>
      <label class="mm-choice"><input type="checkbox" id="hDel"> They also asked to delete their Mirror (deleted after 30 days; they can cancel in Settings)</label>
      <label class="mm-choice" style="margin-bottom:var(--mm-space-3)"><input type="checkbox" id="hSure"> I confirmed it is them by phone, video or in person.</label>
      <div id="hMsg" aria-live="assertive"></div>
      <button class="mm-btn" type="submit">Hide it now</button>
    </form></section>

  <section id="pNotice"><h2>Change notice at sign-in</h2>
    <form class="mm-card mm-read" id="nForm" novalidate>
      <p class="mm-hint">The privacy page promises: if we change how we use or share information, people are told in the Mirror at their next sign-in,
        before the change starts. The notice shows at the top of every Mirror page until each person presses "I've read it". Only the 2nd Chance
        main admin can set it. Leave the text empty and save to take the notice down.</p>
      <div class="mm-field"><label for="nText">What changes, in plain words</label><textarea class="mm-input" id="nText" rows="4" maxlength="1000"></textarea></div>
      <div class="mm-field"><label for="nStarts">The day it starts <span class="mm-muted">(after today)</span></label><input class="mm-input" type="date" id="nStarts" style="max-width:12rem"></div>
      <div id="nMsg" aria-live="assertive"></div>
      <button class="mm-btn" type="submit">Save the notice</button>
    </form></section>`;

box.querySelector("#hForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.currentTarget, m = f.querySelector("#hMsg");
  if (!f.querySelector("#hSure").checked) { m.innerHTML = notice("urgent", "<p>Confirm it is them first, then tick the box.</p>"); return; }
  try {
    const t = await rpc("mirror_platform_hide", { p_email: f.querySelector("#hEmail").value.trim(), p_also_delete: f.querySelector("#hDel").checked,
      p_reason: f.querySelector("#hWhy").value.trim(), p_confirmed: true });
    m.innerHTML = notice("ok", `<p>${esc(t)}</p>`); f.reset();
  } catch (err) { m.innerHTML = notice("urgent", `<p>${esc(err.message)}</p>`); }
});
box.querySelector("#nForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const f = e.currentTarget, m = f.querySelector("#nMsg");
  try {
    const v = await rpc("mirror_admin_change_notice_set", { p_text: f.querySelector("#nText").value.trim(), p_starts: f.querySelector("#nStarts").value || null });
    m.innerHTML = notice("ok", v ? "<p>Saved. People see it at their next sign-in.</p>" : "<p>The notice is taken down.</p>");
  } catch (err) { m.innerHTML = notice("urgent", `<p>${esc(err.message)}</p>`); }
});

let before = null, rows = [];
async function audit(more = false) {
  const el = box.querySelector("#aBox");
  const i = box.querySelector("#aOrg").value;
  const orgId = i === "" ? null : (O.organizations[Number(i)] || {}).id || null;
  if (!more) { before = null; rows = []; }
  let A;
  try { A = await rpc("mirror_platform_audit", { p_org: orgId, p_before: before }); } catch (e) { el.innerHTML = notice("caution", `<p>${esc(e.message)}</p>`); return; }
  rows = rows.concat(A.rows);
  if (A.rows.length) before = A.rows[A.rows.length - 1].id;
  el.innerHTML = rows.length ? table("Audit log", ["When", "Organization", "Who", "What", "Topic", "Person"], rows.map((r) => [esc(when(r.at)), esc(r.organization || "-"),
      esc(r.who), esc(r.action + (r.what ? " (" + r.what + ")" : "")) + (r.reason ? `<br><span class="mm-small mm-muted">${esc(r.reason)}</span>` : ""),
      esc(TOPIC[r.category] || r.category || ""), esc(r.person || "-")]))
      + (A.more ? '<p><button class="mm-btn mm-btn-secondary" type="button" id="aMore">Show older</button></p>' : "")
    : '<p class="mm-muted">Nothing in the log yet.</p>';
  el.querySelector("#aMore")?.addEventListener("click", () => audit(true));
}
box.querySelector("#aOrg").addEventListener("change", () => audit());
audit();
</script>
</body>
</html>
