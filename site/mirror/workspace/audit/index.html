<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Who looked and changed what | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="workspace">
<main id="main" class="mm-main">
  <p class="mm-eyebrow"><a href="/mirror/workspace/">Workspace</a></p>
  <h1>Who looked and changed what</h1>
  <p class="mm-lead">Your organization's own record: every time someone here opened a private topic, changed something, or was turned away. Organization admins only.</p>
  <div id="mmAudit"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
// Phase 2 fix P2-07, built with Phase 8 T8.1 (11/13/2026): the organization's view of its own audit log (mirror_org_audit).
// Members are shown by name, never by email; a person not on the organization's list is not named. Reading this page is itself recorded.
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice } from "/mirror/assets/mirror-ui.js?v=20261113h";

const ACTION = { view: "looked at", edit: "changed", refused: "was turned away from", export: "downloaded", consent_grant: "shared",
  consent_revoke: "stopped sharing", invitation_accept: "accepted the invitation", invitation_decline: "declined the invitation", delete_request: "asked to delete their Mirror" };
const TOPIC = { general: "answers in general", health: "physical health", mental_health: "how they feel inside", safety: "safety", legal: "ID, papers and legal matters",
  immigration: "immigration", financial: "money and the Daily Number", documents: "documents", audit: "this record", organization: "the organization", safety_flag: "safety mode" };
const WHAT = { needs: "needs", need_events: "a need's history", goals: "goals", action_items: "steps", milestones: "milestones", strengths: "strengths",
  workspace_dashboard: "the dashboard", workspace_people: "the people list", audit_logs: "this record", progress: "progress", organization_individuals: "who they work with",
  consents: "sharing", assessment_responses: "answers", functional_assessments: "everyday activities", housing_profiles: "where they live", conversations: "a conversation" };
const WHY = { no_consent: "not shared with your organization", no_authenticator: "no authenticator code yet", view_as: "office View as" };
const ROLE = { org_admin: "admin", coordinator: "coordinator", volunteer: "volunteer", self: "the person", view_as: "office" };
const when = (d) => new Date(d).toLocaleString("en-US", { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });

const w = await requireArea("workspace");
const box = document.getElementById("mmAudit");
const admins = w.memberships.filter((m) => m.role === "org_admin");
let org = admins[0] && admins[0].organization_id, person = "", rows = [], more = false, people = [];

if (!admins.length) box.innerHTML = notice("info", "<p>This record is for organization admins. Ask your organization's admin if you need to know who looked at something.</p>");
else start();

async function start() {
  try { people = (await rpc("mirror_people", { p_org: org })).filter((p) => p.status !== "invited"); } catch { people = []; }
  rows = []; await page(null);
}

async function page(before) {
  try {
    const r = await rpc("mirror_org_audit", { p_org: org, p_before: before, p_individual: person || null });
    rows = rows.concat(r.rows); more = r.more;
  } catch (e) { box.innerHTML = notice("urgent", `<p>${esc(e.message)}</p>`); return; }
  draw();
}

function line(r) {
  const act = ACTION[r.action] || r.action.replace(/_/g, " ");
  const topic = r.category ? TOPIC[r.category] || r.category.replace(/_/g, " ") : "";
  const what = r.what && WHAT[r.what] ? WHAT[r.what] : "";
  return `<tr><td data-label="When">${esc(when(r.at))}</td>
    <td data-label="Who">${esc(r.who)}${r.role && ROLE[r.role] && r.role !== "self" ? ` <span class="mm-muted mm-small">(${esc(ROLE[r.role])})</span>` : ""}</td>
    <td data-label="What">${esc(act)}${topic ? " " + esc(topic) : ""}${what ? ` <span class="mm-muted mm-small">(${esc(what)})</span>` : ""}${r.reason ? `<br><span class="mm-small">Why: ${esc(WHY[r.reason] || r.reason)}</span>` : ""}</td>
    <td data-label="Person">${r.person ? (r.person_id ? `<a href="/mirror/workspace/person/?id=${encodeURIComponent(r.person_id)}&org=${encodeURIComponent(org)}">${esc(r.person)}</a>` : esc(r.person)) : '<span class="mm-muted">-</span>'}</td></tr>`;
}

function draw() {
  box.innerHTML = `
    <div class="mm-row" style="gap:var(--mm-space-4);align-items:flex-end">
      ${admins.length > 1 ? `<div class="mm-field" style="margin:0"><label for="aOrg">Organization</label><select class="mm-select" id="aOrg">
        ${admins.map((o) => `<option value="${esc(o.organization_id)}"${o.organization_id === org ? " selected" : ""}>${esc(o.organization)}</option>`).join("")}</select></div>` : ""}
      <div class="mm-field" style="margin:0;min-width:16rem"><label for="aWho">Person</label><select class="mm-select" id="aWho"><option value="">Everyone</option>
        ${people.map((p) => `<option value="${esc(p.id)}"${p.id === person ? " selected" : ""}>${esc(p.preferred_name)}</option>`).join("")}</select></div></div>
    <p class="mm-small mm-muted mm-read">Each person sees the same looks and changes on their own "Who looked" list. This record can't be changed or deleted.
      Opening this page is recorded too.</p>
    ${rows.length ? `<div class="mm-table-wrap mm-stack"><table class="mm-table"><caption class="mm-sr">Your organization's record, newest first</caption>
      <thead><tr><th scope="col">When</th><th scope="col">Who</th><th scope="col">What</th><th scope="col">Person</th></tr></thead>
      <tbody>${rows.map(line).join("")}</tbody></table></div>` : notice("info", "<p>Nothing recorded yet.</p>")}
    ${more ? '<p><button class="mm-btn mm-btn-secondary" type="button" id="aMore">Show older</button></p>' : ""}`;
  box.querySelector("#aOrg")?.addEventListener("change", (e) => { org = e.target.value; person = ""; start(); });
  box.querySelector("#aWho")?.addEventListener("change", (e) => { person = e.target.value; rows = []; page(null); });
  box.querySelector("#aMore")?.addEventListener("click", () => page(rows[rows.length - 1].id));
}
</script>
</body>
</html>
