<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Donated Goods | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="workspace">
<main id="main" class="mm-main">
  <p class="mm-eyebrow"><a href="/mirror/workspace/">Workspace</a></p>
  <h1>Donated goods</h1>
  <p class="mm-lead">Your organization's clothing, shoes, coats, bedding, furniture and other donated items: sizes, condition, season and how many are on hand.
    Only your organization sees this list.</p>
  <div id="mmInv"><p role="status">Loading…</p></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
// Phase 8 T8.7 (11/13/2026, D-38): the organization's own stock. Coordinators and organization admins add, change and give; volunteers
// do not. Giving to a person in the Mirror needs their everyday "see and change" and shows on their Mirror; giving to someone else keeps no name.
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice, toast } from "/mirror/assets/mirror-ui.js?v=20261113h";
import { voiceAll } from "/mirror/assets/mirror-voice.js?v=20261113c";

const CAT = { clothing: "Clothing", shoes: "Shoes", coats: "Coats", bedding: "Bedding", furniture: "Furniture", kitchen: "Kitchen", hygiene: "Hygiene",
  baby: "Baby", school: "School", household: "Household", other: "Other" };
const FITS = { "": "Not said", women: "Women", men: "Men", girls: "Girls", boys: "Boys", baby: "Baby", anyone: "Anyone" };
const COND = { new: "New", like_new: "Like new", good: "Good", fair: "Fair" };
const SEASON = { all: "All year", winter: "Winter", summer: "Summer", spring_fall: "Spring and fall" };
const opts = (o, sel) => Object.entries(o).map(([k, l]) => `<option value="${esc(k)}"${k === (sel || "") ? " selected" : ""}>${esc(l)}</option>`).join("");

const w = await requireArea("workspace");
const orgs = w.memberships.filter((m) => m.role === "org_admin" || m.role === "coordinator");
const box = document.getElementById("mmInv");
const asked = new URLSearchParams(location.search).get("org");
let org = (orgs.find((o) => o.organization_id === asked) || orgs[0] || {}).organization_id;

if (!orgs.length) box.innerHTML = notice("info", "<p>Volunteers don't manage donated goods. Ask your organization's coordinator.</p>");
else draw();

function itemForm(it) {
  const k = it ? it.id : "new";
  return `<form class="mm-card mm-read" data-item="${esc(k)}" novalidate style="margin-top:var(--mm-space-3)">
    ${it ? "" : '<h2 style="margin-top:0">Add donated items</h2>'}
    <div class="mm-row" style="gap:var(--mm-space-3)">
      <div class="mm-field"><label for="c-${k}">Kind</label><select class="mm-select" id="c-${k}">${opts(CAT, it ? it.category : "clothing")}</select></div>
      <div class="mm-field" style="min-width:14rem"><label for="i-${k}">Item</label><input class="mm-input" id="i-${k}" maxlength="120" value="${esc(it ? it.item : "")}"></div>
      <div class="mm-field" style="max-width:8rem"><label for="q-${k}">How many</label><input class="mm-input" id="q-${k}" inputmode="numeric" value="${esc(it ? it.quantity : 1)}" data-mm-no-voice></div></div>
    <div class="mm-row" style="gap:var(--mm-space-3)">
      <div class="mm-field" style="max-width:10rem"><label for="z-${k}">Size</label><input class="mm-input" id="z-${k}" maxlength="40" value="${esc((it && it.size) || "")}"></div>
      <div class="mm-field"><label for="f-${k}">Fits</label><select class="mm-select" id="f-${k}">${opts(FITS, it && it.fits)}</select></div>
      <div class="mm-field"><label for="o-${k}">Condition</label><select class="mm-select" id="o-${k}">${opts(COND, it ? it.condition : "good")}</select></div>
      <div class="mm-field"><label for="s-${k}">Season</label><select class="mm-select" id="s-${k}">${opts(SEASON, it ? it.season : "all")}</select></div></div>
    <div class="mm-field"><label for="l-${k}">Where it's kept <span class="mm-muted">(optional)</span></label><input class="mm-input" id="l-${k}" maxlength="120" value="${esc((it && it.location) || "")}"></div>
    <div class="mm-field"><label for="n-${k}">Note <span class="mm-muted">(optional; no one's personal details)</span></label><input class="mm-input" id="n-${k}" maxlength="500" value="${esc((it && it.note) || "")}"></div>
    ${it ? `<div class="mm-field"><label class="mm-choice"><input type="checkbox" id="a-${k}"${it.active ? " checked" : ""}> Keep on the list <span class="mm-muted">(untick to retire it)</span></label></div>` : ""}
    <button class="mm-btn" type="submit">${it ? "Save" : "Add"}</button></form>`;
}

async function draw(note = "") {
  let I, people = [];
  try { I = await rpc("mirror_inventory", { p_org: org }); } catch (e) { box.innerHTML = notice("urgent", `<p>${esc(e.message)}</p>`); return; }
  try { people = (await rpc("mirror_people", { p_org: org })).filter((p) => p.status === "active"); } catch { people = []; }
  const onHand = I.items.filter((i) => i.active).reduce((s, i) => s + i.quantity, 0);
  const row = (i) => `<tr data-row data-cat="${esc(i.category)}" data-season="${esc(i.season)}" data-fits="${esc(i.fits || "")}" data-qty="${i.quantity}" data-active="${i.active ? 1 : 0}"
      data-text="${esc((i.item + " " + (i.size || "") + " " + (i.location || "")).toLowerCase())}" data-id="${esc(i.id)}">
    <td data-label="Item"><strong>${esc(i.item)}</strong>${i.active ? "" : ' <span class="mm-tag">Retired</span>'}<br><span class="mm-muted mm-small">${esc(CAT[i.category])}${i.location ? " · " + esc(i.location) : ""}</span></td>
    <td data-label="Size">${esc(i.size || "")}${i.fits ? ` <span class="mm-muted mm-small">${esc(FITS[i.fits])}</span>` : ""}</td>
    <td data-label="Condition">${esc(COND[i.condition])}</td>
    <td data-label="Season">${esc(SEASON[i.season])}</td>
    <td class="mm-num" data-label="On hand">${i.quantity}</td>
    <td class="mm-num" data-label="Given, 30 days">${Number(i.given_30) || 0}</td>
    <td data-label=""><button class="mm-btn mm-btn-quiet" type="button" data-give${i.active && i.quantity > 0 ? "" : " disabled"}>Give</button>
      <button class="mm-btn mm-btn-quiet" type="button" data-edit>Change</button></td></tr>
    <tr data-more-for="${esc(i.id)}" style="display:none"><td colspan="7"><div data-more></div></td></tr>`;
  box.innerHTML = `
    ${orgs.length > 1 ? `<div class="mm-field" style="max-width:24rem"><label for="mmOrg">Organization</label>
      <select class="mm-select" id="mmOrg">${orgs.map((o) => `<option value="${esc(o.organization_id)}"${o.organization_id === org ? " selected" : ""}>${esc(o.organization)}</option>`).join("")}</select></div>` : ""}
    ${note}
    <p><strong>${onHand}</strong> on hand · <strong>${Number(I.given_30) || 0}</strong> given in the last 30 days${Number(I.given_30_outside) ? ` (${Number(I.given_30_outside)} to people not in the Mirror)` : ""}.</p>
    ${I.items.length ? `<div class="mm-row" style="gap:var(--mm-space-4);align-items:flex-end">
      <div class="mm-field" style="margin:0;min-width:14rem"><label for="mmFind">Find</label><input class="mm-input" id="mmFind" type="search" autocomplete="off" data-mm-no-voice></div>
      <div class="mm-field" style="margin:0"><label for="mmCat">Kind</label><select class="mm-select" id="mmCat"><option value="">All kinds</option>${opts(CAT, "")}</select></div>
      <div class="mm-field" style="margin:0"><label for="mmSeason">Season</label><select class="mm-select" id="mmSeason"><option value="">Any season</option>${opts(SEASON, "")}</select></div>
      <div class="mm-field" style="margin:0"><label for="mmFits">Fits</label><select class="mm-select" id="mmFits"><option value="">Anyone</option>${opts(Object.fromEntries(Object.entries(FITS).filter(([k]) => k)), "")}</select></div>
      <div class="mm-field" style="margin:0"><label for="mmShow">Show</label><select class="mm-select" id="mmShow"><option value="have">On hand</option><option value="all">Everything, also none left</option><option value="retired">Retired</option></select></div>
      <p class="mm-small mm-muted" id="mmShown" aria-live="polite" style="margin:0"></p></div>
    <div class="mm-table-wrap mm-stack"><table class="mm-table"><caption class="mm-sr">Donated goods</caption>
      <thead><tr><th scope="col">Item</th><th scope="col">Size</th><th scope="col">Condition</th><th scope="col">Season</th><th scope="col" class="mm-num">On hand</th><th scope="col" class="mm-num">Given, 30 days</th><th scope="col"><span class="mm-sr">Actions</span></th></tr></thead>
      <tbody>${I.items.map(row).join("")}</tbody></table></div>` : notice("info", "<p>Nothing on the list yet. Add the first items below.</p>")}
    <div data-new>${itemForm(null)}</div>`;
  voiceAll(box);
  const q = (s) => box.querySelector(s);
  const filter = () => {
    if (!q("#mmFind")) return;
    const t = q("#mmFind").value.trim().toLowerCase(), c = q("#mmCat").value, s = q("#mmSeason").value, f = q("#mmFits").value, sh = q("#mmShow").value;
    let n = 0;
    box.querySelectorAll("tr[data-row]").forEach((tr) => {
      const d = tr.dataset;
      const okShow = sh === "retired" ? d.active === "0" : d.active === "1" && (sh === "all" || Number(d.qty) > 0);
      const on = okShow && (!c || d.cat === c) && (!s || d.season === s || d.season === "all") && (!f || d.fits === f || d.fits === "anyone" || !d.fits) && (!t || d.text.includes(t));
      tr.style.display = on ? "" : "none";
      if (!on) box.querySelector(`tr[data-more-for="${d.id}"]`).style.display = "none";
      if (on) n++;
    });
    q("#mmShown").textContent = n + (n === 1 ? " item shown" : " items shown");
  };
  ["#mmFind", "#mmCat", "#mmSeason", "#mmFits", "#mmShow"].forEach((s) => q(s)?.addEventListener(s === "#mmFind" ? "input" : "change", filter));
  filter();
  q("#mmOrg")?.addEventListener("change", (e) => { org = e.target.value; draw(); });

  const wireItem = (f, it) => f.addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const k = it ? it.id : "new";
    const v = (x) => f.querySelector("#" + x + "-" + k).value;
    const p = { category: v("c"), item: v("i"), quantity: v("q"), size: v("z"), fits: v("f"), condition: v("o"), season: v("s"), location: v("l"), note: v("n") };
    try {
      await rpc("mirror_inventory_save", { p: it ? { ...p, id: it.id, active: f.querySelector("#a-" + k).checked } : { ...p, organization_id: org } });
      draw(notice("ok", `<p>${it ? "Saved" : "Added"}: <strong>${esc(p.item.trim())}</strong>.</p>`));
    } catch (err) { toast(err.message); }
  });
  wireItem(q('[data-item="new"]'), null);
  box.querySelectorAll("tr[data-row]").forEach((tr) => {
    const it = I.items.find((x) => x.id === tr.dataset.id);
    const holder = box.querySelector(`tr[data-more-for="${it.id}"]`);
    const more = holder.querySelector("[data-more]");
    const open = (html) => { holder.style.display = ""; more.innerHTML = html; voiceAll(more); };
    tr.querySelector("[data-edit]").addEventListener("click", () => { open(itemForm(it)); wireItem(more.querySelector("form"), it); });
    tr.querySelector("[data-give]").addEventListener("click", () => {
      open(`<form class="mm-row" novalidate style="align-items:flex-end;gap:var(--mm-space-3)">
        <div class="mm-field" style="margin:0;max-width:7rem"><label for="gq-${it.id}">How many</label><input class="mm-input" id="gq-${it.id}" inputmode="numeric" value="1" data-mm-no-voice></div>
        <div class="mm-field" style="margin:0;min-width:14rem"><label for="gp-${it.id}">To</label><select class="mm-select" id="gp-${it.id}">
          <option value="">Someone not in the Mirror (no name kept)</option>${people.map((p) => `<option value="${esc(p.id)}">${esc(p.preferred_name)}</option>`).join("")}</select></div>
        <div class="mm-field" style="margin:0;min-width:14rem"><label for="gn-${it.id}">Note <span class="mm-muted">(optional; the person sees it)</span></label><input class="mm-input" id="gn-${it.id}" maxlength="500"></div>
        <button class="mm-btn" type="submit">Give</button></form>
        <p class="mm-hint">Giving to a person in the Mirror needs their "see and change" for everyday things. It shows on their Mirror.</p>`);
      more.querySelector("form").addEventListener("submit", async (ev) => {
        ev.preventDefault();
        try {
          const r = await rpc("mirror_inventory_give", { p: { item_id: it.id, quantity: more.querySelector(`#gq-${it.id}`).value,
            individual_id: more.querySelector(`#gp-${it.id}`).value, note: more.querySelector(`#gn-${it.id}`).value } });
          draw(notice("ok", `<p>Recorded. ${r.left} left of <strong>${esc(it.item)}</strong>.</p>`));
        } catch (err) { toast(err.message); }
      });
    });
  });
}
</script>
</body>
</html>
