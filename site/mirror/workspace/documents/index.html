<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Documents | The Human Mirror</title>
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">
<link rel="stylesheet" href="/mirror/assets/mirror.css?v=20261113l">
</head>
<body data-area="workspace">
<!-- Phase 7 (T7.4): a person's documents, only as they share the Documents topic with this organization ("can see" opens them,
     "see and change" also adds). Every opening is logged in the person's record of who looked. -->
<main id="main" class="mm-main">
  <p class="mm-eyebrow"><a href="/mirror/workspace/people/">People</a> · <a id="mmBack" href="/mirror/workspace/people/">This person</a></p>
  <div id="mmHead"><p role="status">Loading…</p></div>
  <div id="mmBox" class="mm-read"></div>
</main>
<script type="module" src="/mirror/assets/mirror-ui.js?v=20261113h"></script>
<script type="module">
import { requireArea, rpc } from "/mirror/assets/mirror-client.js?v=20261113p";
import { esc, notice } from "/mirror/assets/mirror-ui.js?v=20261113h";
import { docsBox } from "/mirror/assets/mirror-docs.js?v=20261113a";

const w = await requireArea("workspace");
const q = new URLSearchParams(location.search);
const id = q.get("id") || "", org = q.get("org") || (w.memberships[0] && w.memberships[0].organization_id);
/** @type {HTMLAnchorElement} */ (document.getElementById("mmBack")).href = `/mirror/workspace/person/?id=${encodeURIComponent(id)}&org=${encodeURIComponent(org)}`;
const head = /** @type {HTMLElement} */ (document.getElementById("mmHead"));
try {
  const person = (await rpc("mirror_people", { p_org: org })).find((/** @type {any} */ p) => p.id === id);
  if (!person) throw new Error("This person is not on your organization's list.");
  head.innerHTML = `<h1>Documents for ${esc(person.preferred_name)}</h1>
    <p class="mm-lead">Only what ${esc(person.preferred_name)} shares with you. Each time you open one, it shows in their record of who looked.</p>`;
  docsBox(/** @type {HTMLElement} */ (document.getElementById("mmBox")), id, { name: person.preferred_name });
} catch (e) { head.innerHTML = notice("caution", `<p>${esc(e instanceof Error ? e.message : String(e))}</p>`); }
</script>
</body>
</html>
