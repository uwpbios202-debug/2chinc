<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Resident Portal — 2nd Chance Housing</title>
  <link rel="icon" href="/favicon.png" />
<link rel="manifest" href="/resident/manifest.webmanifest">
<link rel="apple-touch-icon" href="/logo-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="2nd Chance">
<meta name="theme-color" content="#2e7d1f">
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/site.css" />
  <link rel="stylesheet" href="/assets/portal/portal.css" />
  <style>
    body { background: var(--cream); font-family: var(--sans); }
    .shell { display: grid; grid-template-columns: 230px 1fr; min-height: 100vh; }
    .side { background: var(--white); border-right: 1px solid var(--border); padding: 18px 0; position: sticky; top: 0; height: 100vh; overflow-y: auto; }
    .side .logo { display: flex; justify-content: center; margin-bottom: 14px; }
    .side .logo img { width: 84px; height: 84px; border-radius: 50%; }
    .side nav a { display: flex; align-items: center; gap: 10px; padding: 12px 22px; color: var(--text); text-decoration: none; font-weight: 600; font-size: 0.95rem; border-left: 4px solid transparent; }
    .side nav a[aria-current="page"] { background: var(--tint); border-left-color: var(--green); color: var(--green-dk); }
    .side nav a:hover { background: var(--cream); }
    .main { padding: 22px 28px 60px; max-width: 1100px; }
    .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 18px; flex-wrap: wrap; }
    .top h1 { font-family: var(--serif); font-weight: 400; font-size: 1.9rem; margin: 0; }
    .top .addr { color: var(--gray); text-align: right; font-size: 0.92rem; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .box { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 18px 20px; margin-bottom: 16px; }
    .box h2 { font-family: var(--serif); font-weight: 400; font-size: 1.3rem; margin: 0 0 10px; }
    .balance { border-left: 5px solid var(--green); display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
    .balance .amt { font-size: 2.6rem; font-weight: 700; margin-top: 4px; }
    .btn2 { display: inline-block; background: var(--green); color: #fff; border: 0; border-radius: 999px; padding: 11px 22px; font: 700 0.95rem var(--sans); cursor: pointer; text-decoration: none; text-align: center; }
    .btn2.ghost { background: var(--white); color: var(--text); border: 1px solid var(--border); }
    .btn2:disabled { opacity: 0.5; cursor: not-allowed; }
    table.t { width: 100%; border-collapse: collapse; font-size: 0.93rem; }
    table.t th { text-align: left; font-size: 0.75rem; letter-spacing: 0.06em; text-transform: uppercase; color: var(--gray); padding: 10px 8px; border-bottom: 1px solid var(--border); background: var(--cream); }
    table.t td { padding: 11px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
    table.t .num { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .sub2 { color: var(--gray); font-size: 0.85rem; }
    dl.kv { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 18px; margin: 0; }
    dl.kv dt { color: var(--gray); font-size: 0.82rem; font-weight: 600; }
    dl.kv dd { margin: 0 0 4px; font-weight: 500; }
    .tagx { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 700; background: var(--tint); color: var(--green-dk); }
    .tagx.warn { background: #fdf4e1; color: #8a5a00; }
    .tagx.off { background: #edf0f3; color: #667180; }
    .wk { margin-bottom: 14px; }
    .wk h2 { margin: 0 0 4px; }
    .wkpill { display: inline-block; font-size: 0.7rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; padding: 0.15rem 0.6rem; border-radius: 20px; background: var(--tint); color: var(--green-dk); }
    .wkpill.warn { background: #fff3cd; color: #7a5200; } .wkpill.done { background: #e8e8e8; color: #444; }
    .wktask { display: flex; gap: 10px; align-items: center; justify-content: space-between; flex-wrap: wrap; padding: 8px 0; border-top: 1px solid var(--border); }
    .wkterms { border: 1px solid var(--border); border-radius: 8px; padding: 6px 12px; margin: 8px 0; background: var(--white); }
    .wkterms summary { cursor: pointer; font-weight: 600; } .wkterms h4 { margin: 10px 0 2px; } .wkterms ul { margin: 4px 0 4px 1.2rem; }
    .wknote { border-top: 1px solid var(--border); padding: 8px 0; font-size: 0.93rem; }
    .wknote img { max-width: 180px; border-radius: 8px; display: block; margin-top: 4px; }
    .wkcomp { display: grid; gap: 8px; margin-top: 10px; }
    .pkopts { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; margin: 10px 0; }
    .pkopts button { text-align: left; background: var(--white); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; cursor: pointer; font: inherit; }
    .pkopts button:hover, .pkopts button.on { border-color: var(--green); background: var(--tint); }
    .pkopts b { display: block; }
    .pkcard { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 12px 14px; }
    .pkgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 10px; }
    .pkphotos { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 8px 0; }
    .pkphotos img { width: 100%; aspect-ratio: 4 / 3; object-fit: cover; border-radius: 8px; background: #e8ece6; display: block; }
    .pkform { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 10px; margin-top: 10px; }
    .pkform label { display: grid; gap: 3px; font-size: 0.85rem; color: var(--gray); }
    .pkform label.wide { grid-column: 1 / -1; }
    .paygrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; margin-top: 12px; }
    .paycard { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
    .paycard.main { border-color: var(--green); box-shadow: 0 4px 16px rgba(19,32,26,0.08); }
    .paycard h3 { font-size: 1.05rem; margin: 0; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
    .paycard h3 .badge { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase; background: var(--tint); color: var(--green-dk); padding: 0.15rem 0.5rem; border-radius: 20px; }
    .paycard .go { display: block; text-align: center; background: var(--green); color: #fff; text-decoration: none; font-weight: 700; padding: 0.65rem 0.9rem; border-radius: 8px; border: 0; cursor: pointer; font: inherit; font-weight: 700; }
    .paycard .go.alt { background: transparent; color: var(--green-dk); border: 1px solid var(--green); }
    .paycard .detail { font-size: 0.92rem; overflow-wrap: anywhere; }
    .paycard .copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .paycard .copyrow b { font-size: 1.02rem; }
    .paycard canvas, .paycard img.qr { align-self: flex-start; }
    .paycard .banks { display: flex; flex-wrap: wrap; gap: 6px; }
    .paycard .banks a { font-size: 0.8rem; border: 1px solid var(--border); border-radius: 20px; padding: 0.2rem 0.65rem; text-decoration: none; color: var(--text); }
    .req { display: flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
    .req img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; }
    .req .ico { width: 60px; height: 60px; border-radius: 8px; border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-size: 1.4rem; }
    label.f2 { display: block; font-weight: 600; font-size: 0.88rem; margin: 12px 0 5px; }
    .in { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font: 500 0.98rem var(--sans); }
    textarea.in { min-height: 110px; }
    .folder { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); text-decoration: none; color: var(--text); }
    .folder:hover { color: var(--green-dk); }
    .msg2 { min-height: 1.2em; margin-top: 8px; font-size: 0.9rem; }
    .msg2.err { color: #b03a2e; } .msg2.ok { color: var(--green-dk); }
    .menu-btn { display: none; }
    .badge { display: inline-block; min-width: 18px; padding: 0 6px; margin-left: 6px; border-radius: 999px; background: #b03a2e; color: #fff; font-size: 0.75rem; text-align: center; }
    .letter { border-top: 1px solid var(--border); padding: 14px 0; }
    .letter video, .letter audio { width: 100%; max-width: 640px; margin: 8px 0; border-radius: 10px; background: #000; }
    .letter audio { background: none; }
    .search { display: flex; gap: 8px; } .search input { flex: 1; }
    .chat { display: grid; gap: 8px; max-height: 60vh; overflow-y: auto; padding: 4px; }
    .chat .b { max-width: 80%; padding: 10px 14px; border-radius: 14px; background: #f1f3f5; white-space: pre-wrap; }
    .chat .b.me { justify-self: end; background: var(--tint); }
    .chat .b .sub2 { display: block; margin-top: 4px; }
    .nudge { border-left: 5px solid #c9a227; }
    .emerg { background: #fbeceb; border-left: 5px solid #b03a2e; border-radius: 10px; padding: 12px 16px; margin-bottom: 16px; }
    .cats { border: 0; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 8px; }
    .cats legend { padding: 0; }
    .cats label { display: flex; gap: 8px; align-items: flex-start; border: 1px solid var(--border); border-radius: 10px; padding: 10px; cursor: pointer; }
    .cats label:has(input:checked) { border-color: var(--green); background: var(--tint); }
    .cats label > span { display: grid; }
    .yn { border: 0; padding: 0; margin: 0; } .yn label { margin-right: 18px; }
    .rq { border-top: 1px solid var(--border); padding: 14px 0; }
    .rq-h { display: flex; gap: 10px; align-items: center; }
    .rq-h .ico { font-size: 1.5rem; }
    ol.track { display: flex; list-style: none; padding: 0; margin: 10px 0; gap: 4px; }
    ol.track li { flex: 1; text-align: center; font-size: 0.78rem; padding: 6px 2px; border-radius: 6px; background: #edf0f3; color: #667180; }
    ol.track li.done { background: var(--tint); color: var(--green-dk); }
    ol.track li.now { background: var(--green); color: #fff; font-weight: 700; }
    .thread { display: grid; gap: 6px; margin: 8px 0; }
    .thread > div { background: #f5f6f8; border-radius: 10px; padding: 8px 12px; font-size: 0.92rem; }
    .thread > div.me { background: var(--tint); }
    .confirm { border: 1px solid #c9a227; background: #fdf8e8; border-radius: 10px; padding: 12px; margin: 10px 0; }
    .cm { display: flex; gap: 8px; margin-top: 8px; } .cm input { flex: 1; }
    .room { border: 1px solid var(--border); border-radius: 10px; margin: 10px 0; }
    .room > summary { padding: 12px 14px; font-weight: 700; cursor: pointer; display: flex; justify-content: space-between; gap: 10px; }
    .room .body { padding: 0 14px 14px; }
    .ci { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; padding: 8px 0; border-top: 1px solid var(--border); }
    .ci .conds { display: flex; gap: 4px; flex-wrap: wrap; }
    .ci .conds label { border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; font-size: 0.85rem; cursor: pointer; }
    .ci .conds input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .ci .conds input:checked + span { font-weight: 700; color: var(--green-dk); }
    .ci .conds label:has(input:checked) { border-color: var(--green); background: var(--tint); }
    .ci .conds label:has(input[value="damaged"]:checked) { border-color: #b03a2e; background: #fbeceb; }
    .ci .conds label:has(input:focus-visible) { outline: 2px solid var(--green); outline-offset: 2px; }
    .ci input.note { grid-column: 1 / -1; }
    .ci .ci-head { grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: center; gap: 10px; }
    .ci .ci-name { font-weight: 600; }
    .ci .cam { display: inline-flex; align-items: center; gap: 4px; border: 1px solid var(--border); border-radius: 999px; padding: 4px 12px; cursor: pointer; font-size: 1.05rem; background: #fff; }
    .ci .cam:hover { border-color: var(--green); background: var(--tint); }
    .ci .cam:has(input:focus-visible) { outline: 2px solid var(--green); outline-offset: 2px; }
    .ci .cam-n { font-size: 0.8rem; font-weight: 700; color: var(--green-dk); }
    .ci .thumbs.small { grid-column: 1 / -1; margin: 0; }
    .ci .thumbs.small:empty { display: none; }
    .ci .thumbs.small img { width: 60px; height: 60px; }
    .ci [data-imsg]:empty { display: none; }
    .ci .conds label:has(input[value="dirty"]:checked), .ci .conds label:has(input[value="marked"]:checked) { border-color: #c9a227; background: #fdf8e8; }
    @media (max-width: 560px) { .ci { grid-template-columns: 1fr; } }
    .thumbs { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0; }
    .thumbs img { width: 84px; height: 84px; object-fit: cover; border-radius: 8px; border: 1px solid var(--border); }
    .steps { counter-reset: s; }
    .steps > .box > h2::before { counter-increment: s; content: counter(s) ". "; }
    @media (max-width: 860px) {
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side, .side nav { max-width: 100vw; }
      .side { position: static; height: auto; padding: 8px 0; }
      .side .logo { display: none; }
      .side nav { display: flex; overflow-x: auto; }
      .side nav a { border-left: 0; border-bottom: 3px solid transparent; padding: 10px 14px; white-space: nowrap; }
      .side nav a[aria-current="page"] { border-bottom-color: var(--green); }
      .grid2, .grid2[style] { grid-template-columns: 1fr !important; }   /* inline column styles must not keep two columns on a phone */
      .grid2 > *, .shell > *, .main { min-width: 0; }
      .main { padding: 16px; }
      table.t { display: block; overflow-x: auto; }
    }
  </style>
</head>
<body>
<div id="signinWrap" class="wrap" style="max-width:520px;margin:40px auto;padding:0 16px">
  <div style="text-align:center;margin-bottom:12px"><img src="/logo-192.png" alt="2nd Chance Housing" width="90" height="90" style="border-radius:50%"></div>
  <h1 style="font-family:var(--serif);font-weight:400;text-align:center">Resident sign-in</h1>
  <div id="signin" class="narrow"></div>
</div>

<div class="shell" id="shell" hidden>
  <aside class="side">
    <div class="logo"><img src="/logo-192.png" alt="2nd Chance Housing"></div>
    <nav id="nav" aria-label="Resident portal">
      <a href="#home">🏠 Home</a><a href="#checkout" id="navCheckout" hidden>📋 Move-out checklist</a><a href="#movein" id="navMoveIn" hidden>🔑 Move-in</a><a href="#renewal" id="navRenewal" hidden>📝 Renewal</a><a href="#moveout" id="navMoveOut" hidden>📦 Move-out</a><a href="#payments">💳 Payments</a><a href="#requests">🔧 Requests</a>
      <a href="#letters">🎬 Monthly letters</a><a href="#messages">💬 Messages<span class="badge" id="msgBadge" hidden></span></a>
      <a href="#landcontract" id="navLC" hidden>🏡 Land contract</a><a href="#work" id="navWork" hidden>🛠 Work</a><a href="#parking">🚗 Parking</a><a href="#guests">🧳 Guests</a><a href="#keys">🔑 Keys</a><a href="#household">👪 Household</a><a href="#documents">📄 Documents</a><a href="#announcements">📣 Announcements</a><a href="#contacts">👥 Contacts</a><a href="#profile">👤 Profile</a>
      <a href="#" id="signOutLink">↩ Sign out</a>
    </nav>
  </aside>
  <main class="main" id="main" aria-live="polite"></main>
</div>

<footer style="text-align:center;font-size:0.82rem;padding:18px 16px 28px;color:#5f6b63"><a href="/privacy/" style="color:inherit">Privacy policy</a> · 2nd Chance Housing Inc.</footer>

<script type="module">
import { client, $, esc, fmtDate, money, balCell, amtCell, CREDIT_NOTE, signIn, signOut, errorText } from "/assets/portal/portal.js";
import { balClass } from "/assets/portal/balance.js";
import { withStepUp } from "/assets/portal/step-up.js";
import { mountGuests } from "/assets/portal/guests.js";
import { mountKeys } from "/assets/portal/keys.js";
import { mountHvac } from "/assets/portal/hvac.js?v=20261105b";
import { mountKeyAdd } from "/assets/portal/keys-tenant.js";
import { mountStalls } from "/assets/portal/stalls.js?v=20261103b";
import { mountParkAlert } from "/assets/portal/parking-alert.js?v=20261108c";
import { mountParkingStatus } from "/assets/portal/parking-status.js?v=20261109a";
import { mountPushCard } from "/assets/portal/push.js";
import { vinFieldHtml, wireVin, cleanVin } from "/assets/portal/vin.js";
import { mountAssistance } from "/assets/portal/assistance.js";
import { mountHousehold } from "/assets/portal/household.js";
import { mountDisputes, questionCharge } from "/assets/portal/disputes.js";
import { mountInspectionNotices } from "/assets/portal/inspections.js";
import { mountEvictionNotice } from "/assets/portal/eviction-notice.js?v=20261109a";
import { mountInspectionDocs, mountInspectionReport } from "/assets/portal/inspection-tenant.js?v=20261105";
import { mountTenantReports } from "/assets/portal/reports.js";
import QRCode from "https://esm.sh/qrcode@1.5.3";
import { renderPayPalButtons } from "/assets/portal/paypal.js";

let H = null;           // resident_home() payload
const leaseOf = () => H.leases[0] || null;
const lc = () => H.land_contracts[0] || null;
// A land contract buyer (no lease): the tenant-only parts of the portal are hidden and the wording says "payment", not "rent".
const isBuyer = () => !!H && !leaseOf() && !!lc();
const BUYER_HIDDEN = ["letters", "requests", "parking", "guests", "keys", "household", "contacts"];
const first = () => (H.name || "").split(/\s+/)[0];

async function act(body) {
  const { data, error } = await client.functions.invoke("resident-portal", { body });
  if (error) { let m = error.message; try { m = (await error.context.json()).error || m; } catch {} throw new Error(m); }
  return data;
}
const tel = (n) => `<a href="tel:${esc((n || "").replace(/\D/g, ""))}">${esc(n || "")}</a>`;
const balHtml = (n) => Number(n) < -0.004 ? `<span class="b-credit">Credit ${money(-n)}</span>` : `<span class="${balClass(n)}">${money(n)}</span>`;
const creditNote = (n) => Number(n) < -0.004 ? `<div class="sub2" style="margin-top:4px">${CREDIT_NOTE}</div>` : "";
const kindLabel = (e) => e.kind === "in_kind" ? "Work in lieu of rent" : e.kind === "charge" || e.kind === "installment_due" || e.kind === "rent_due" ? "Charge" : e.kind === "late_fee" ? "Late fee" : e.kind === "payment" ? "Payment" : e.kind === "credit" ? "Credit" : (e.type || e.kind);

function historyRows(list, limit) {
  let run = 0;
  const rows = (list || []).map((e) => { run += Number(e.amount); return { ...e, run: Math.round(run * 100) / 100 }; }).reverse();
  return (limit ? rows.slice(0, limit) : rows).map((e) => `<tr><td>${fmtDate(e.date)}</td><td><b>${esc(kindLabel(e))}</b><div class="sub2">${esc(e.memo || "")}</div>
    ${Number(e.amount) > 0 && leaseOf() ? `<button class="linklike" type="button" data-qdate="${esc(e.date)}" data-qamt="${esc(e.amount)}" data-qmemo="${esc(e.memo || "")}" style="background:none;border:0;padding:0;color:var(--green,#2e7d1f);text-decoration:underline;cursor:pointer;font-size:.85rem">Question this</button>` : ""}</td>
    <td class="num">${amtCell(e)}</td><td class="num">${balCell(e.run)}</td></tr>`).join("");
}

function leaseInfo(l) {
  return `<div class="box"><h2>Lease information</h2><dl class="kv">
    <dt>Account number</dt><dd>${esc(l.account_number || "—")}</dd>
    <dt>Address</dt><dd>${esc(l.address || "")}</dd>
    <dt>Start date</dt><dd>${fmtDate(l.start_date)}</dd>
    <dt>Term</dt><dd>${l.end_date ? "until " + fmtDate(l.end_date) : "month-to-month"}</dd>
    <dt>Rent</dt><dd>${money(l.rent)}</dd>
    <dt>Deposits</dt><dd>${l.deposit_held == null ? "—" : money(l.deposit_held)}</dd></dl></div>`;
}
function contactBox() {
  const s = H.settings || {};
  return `<div class="box"><h2>Contact us</h2><p>🏢 ${esc(s.office_name || "")}</p><p>📞 Office: ${tel(s.org_phone || s.office_phone)}</p>
    <p>🔧 Maintenance &amp; emergencies: ${tel(s.emergency_phone || s.office_phone)}</p>
    <p>✉️ <a href="mailto:${esc(s.org_email || s.office_email || "")}">${esc(s.org_email || s.office_email || "")}</a></p></div>`;
}

// Stage 2: before the keys are handed over, the home page leads with the move-in step.
function moveInBox(l) {
  const m = H.movein, st = m && m.checklist ? m.checklist.status : "draft";
  if (m && m.keys_ready_at && !["submitted", "approved"].includes(st)) {
    const late = new Date(m.due_on + "T23:59:59") < new Date();
    return `<div class="box" style="border-left:5px solid #c9a227"><h2>📋 ${st === "returned" ? "Your move-in checklist needs a change" : "Finish your move-in checklist"}</h2>
      <p>Go room by room and note the condition of each item, with photos${late ? "" : `, by <b>${fmtDate(m.due_on)}</b>`}. It protects your security deposit when you move out.</p>
      <a class="btn2" href="#movein">Open the checklist</a></div>`;
  }
  if (!l || !l.move_in_charges_posted || l.keys_released_at) return "";
  const s = H.settings || {};
  if (l.keys_ready_at) return `<div class="box" style="border-left:5px solid var(--green)"><h2>🔑 Your keys are ready</h2>

// The bank a resident uses for Zelle, saved to their account so it is there next time (and on any device).
// If the server can't save it, it is kept in this browser instead.
const BANK_KEY = "zelleBank";
const ZELLE_BANKS = [["Chase", "https://www.chase.com"], ["Bank of America", "https://www.bankofamerica.com"], ["Wells Fargo", "https://www.wellsfargo.com"], ["US Bank", "https://www.usbank.com"],
  ["PNC", "https://www.pnc.com"], ["Citi", "https://www.citi.com"], ["Capital One", "https://www.capitalone.com"], ["Associated Bank", "https://www.associatedbank.com"],
  ["Huntington / TCF", "https://www.huntington.com"], ["Bank of Milwaukee", "https://www.bankofmilwaukee.com"], ["Educators Credit Union", "https://www.ecu.com"], ["Landmark Credit Union", "https://www.landmarkcu.com"]];
async function loadBank() {
  try { const { data, error } = await client.rpc("resident_bank_get"); if (!error && data && data.url) return data; } catch {}
  try { const v = JSON.parse(localStorage.getItem(BANK_KEY) || "null"); if (v && v.url) return v; } catch {}
  return null;
}
async function saveBank(b) {
  try { localStorage.setItem(BANK_KEY, JSON.stringify(b)); } catch {}
  try { const { error } = await client.rpc("resident_bank_save", { p_name: b ? b.name : "", p_url: b ? b.url : "" }); if (error) throw error; } catch {}
}
function zelleBankBlock(s) {
  const b = H.bank, addr = s.pay_zelle_to || "";
  if (b && b.url && !H.bankEdit) return `<a class="go" href="${esc(b.url)}" target="_blank" rel="noopener" data-zbopen="${esc(addr)}">Open ${esc(b.name)} to send with Zelle</a>
      <div class="sub2">We copy ${addr ? "<b>" + esc(addr) + "</b>" : "the Zelle address"} when you tap, so you can paste it in Zelle.
        <button class="linkish" type="button" data-zbchange>Use a different bank</button></div>`;
  return `<div class="detail"><b>Set up your bank once</b>, and next time one tap takes you there.</div>
      <select class="in" data-zbsel aria-label="Your bank"><option value="">Choose your bank</option>${ZELLE_BANKS.map(([n, u]) => `<option value="${esc(u)}" ${b && b.url === u ? "selected" : ""}>${esc(n)}</option>`).join("")}<option value="other">My bank is not listed</option></select>
      <input class="in" data-zbother type="text" placeholder="Your bank's website, like https://www.mybank.com" hidden>
      <button class="go" type="button" data-zbsave>Save my bank</button>${b ? ` <button class="linkish" type="button" data-zbcancel>Cancel</button>` : ""}

async function miSave(submit) {

// Redraw the checklist without losing the tenant's place: same scroll position, same rooms open.
function redrawInPlace() {
  const y = window.scrollY, open = [...document.querySelectorAll("details.room[open]")].map((x) => x.dataset.roomkey);
  route();
  document.querySelectorAll("details.room").forEach((x) => { if (open.includes(x.dataset.roomkey)) x.open = true; });

// The checklist saves itself a moment after each change, so the tenant can stop anytime and pick up later.
let miTimer = null;
function miAutosave() {
  clearTimeout(miTimer);
  const note = $("miAuto"); if (note) { note.className = "sub2"; note.textContent = "Saving…"; }
  miTimer = setTimeout(async () => {
    try {
      await miSave(false);
      const n = $("miAuto"); if (n) n.textContent = "✓ Saved " + new Date().toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" }) + ". You can stop and come back anytime.";
    } catch (e) { const n = $("miAuto"); if (n) { n.className = "msg2 err"; n.textContent = "Not saved: " + e.message; } }
  }, 1200);
}
async function miUpload(files, folder) {
  const st = miState(), paths = [];
  for (const f of [...files].slice(0, 12)) {
    const path = `${st.lease}/${MIMODE === "out" ? "out/" : ""}${folder}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${(f.type.split("/")[1] || "jpg").replace("jpeg", "jpg")}`;
    const { error } = await client.storage.from("move-in").upload(path, f, { contentType: f.type || "image/jpeg" });
    if (error) throw new Error("A photo couldn't be uploaded. Try a smaller photo.");
    paths.push(path);
  }
  return paths;
}
function bindMoveIn() {
  miPhotos();
  const st = miSrc() && miState();
  if (!st) return;
  const room = (k) => (st.data.rooms[k] = st.data.rooms[k] || { items: {}, photos: [] });
  const item = (ci) => { const r = room(ci.dataset.room); r.items = r.items || {}; return (r.items[ci.dataset.item] = r.items[ci.dataset.item] || {}); };
  const refreshTag = (ci) => {
    const det = ci.closest("details.room"), def = (miSrc().rooms || []).find((x) => x.key === det.dataset.roomkey), tag = det.querySelector("[data-roomtag]");
    if (!def || !tag) return;
    const done = roomDone(def, room(def.key));
    tag.textContent = done ? "Done" : "To do"; tag.className = "tagx " + (done ? "" : "warn");
  };
  document.querySelectorAll(".ci[data-room]").forEach((ci) => {
    ci.querySelectorAll("input[data-cond]").forEach((el) => el.onchange = () => {
      item(ci).c = el.value;
      const note = ci.querySelector("input[data-note]"); if (note) note.placeholder = el.value === "damaged" ? "Describe the damage (required)" : "Details (optional)";
      refreshTag(ci); miAutosave();
    });
    const note = ci.querySelector("input[data-note]");
    if (note) note.oninput = () => { item(ci).n = note.value; refreshTag(ci); miAutosave(); };
    const cam = ci.querySelector("input[data-iphoto]");
    if (cam) cam.onchange = async () => {
      const msg = ci.querySelector("[data-imsg]"); msg.className = "sub2"; msg.textContent = "Uploading…";
      try {
        const it = item(ci), added = await miUpload(cam.files, `${ci.dataset.room}/items`);
        it.p = [...(it.p || []), ...added];
        const box = ci.querySelector("[data-ithumbs]");
        added.forEach((p) => { const img = document.createElement("img"); img.alt = ci.dataset.item + " photo"; img.dataset.photo = p; box.appendChild(img); });
        ci.querySelector(".cam-n").textContent = it.p.length;
        msg.textContent = ""; cam.value = ""; miPhotos(); miAutosave();
      } catch (e) { msg.className = "msg2 err"; msg.textContent = e.message; }
    };
  });
  document.querySelectorAll("input[data-na]").forEach((el) => el.onchange = () => { room(el.dataset.na).na = el.checked; miAutosave(); redrawInPlace(); });
  document.querySelectorAll("input[data-upload]").forEach((el) => el.onchange = async () => {
    const k = el.dataset.upload, msg = document.querySelector(`[data-upmsg="${k}"]`), r = room(k);
    msg.textContent = "Uploading…";
    try {
      const added = await miUpload(el.files, k);
      r.photos = [...(r.photos || []), ...added];
      const box = document.querySelector(`[data-thumbs="${k}"]`);
      added.forEach((p) => { const img = document.createElement("img"); img.alt = "Room photo"; img.dataset.photo = p; box.appendChild(img); });
      msg.textContent = ""; el.value = ""; miPhotos(); miAutosave();
    } catch (e) { msg.textContent = e.message; }
  });
  $("miPrior") && ($("miPrior").onchange = () => { st.prior = $("miPrior").checked; miAutosave(); });
  const go = (submit, btn) => async () => {
    clearTimeout(miTimer);
    const m = $("miMsg"); btn.disabled = true; m.className = "msg2"; m.textContent = submit ? "Sending…" : "Saving…";
    try {
      await miSave(submit);
      if (submit) { await reload(); MI = null; route(); window.scrollTo(0, 0); }
      else { m.className = "msg2 ok"; m.textContent = "Saved. You can stop now and finish later: your answers and photos will be here."; btn.disabled = false; }
    } catch (e) { m.className = "msg2 err"; m.textContent = e.message; btn.disabled = false; }
  };
  $("miSave") && ($("miSave").onclick = go(false, $("miSave")));
  $("miSend") && ($("miSend").onclick = go(true, $("miSend")));
}

async function shrinkPhoto(file, max = 1600) {
  try {
    const bmp = await createImageBitmap(file), s = Math.min(1, max / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise((r) => c.toBlob(r, "image/jpeg", 0.82));
  } catch { return file; }
}

// Keep the element matching sel at screen position y while the page around it finishes loading (about 3 seconds),
// unless the person scrolls themselves.
function holdInPlace(sel, y) {
  let stop = false; const quit = () => { stop = true; };
  ["wheel", "touchstart", "keydown"].forEach((e) => window.addEventListener(e, quit, { once: true, passive: true }));
  const fix = () => { if (stop) return; const el = document.querySelector(sel); if (!el) return; const d = el.getBoundingClientRect().top - y; if (Math.abs(d) > 1) window.scrollBy(0, d); };
  fix(); const ro = new ResizeObserver(fix); ro.observe(document.body);
  setTimeout(() => { ro.disconnect(); quit(); }, 3000);
}

function payAdvice(f) {
  const m = String(f || "").toLowerCase(); if (!m) return "";
  let t = "";
  if (/limit|balance|velocity|exceed/.test(m)) t = "Your card has a spending limit. Try a smaller amount on this card (for example half), then pay the rest with another card or from your bank account.";
  else if (/declined|not supported|do not honor|generic/.test(m)) t = "Your card company or our payment processor declined it. Prepaid cards are often declined: use a debit card from your bank, or choose Enter bank details manually. A smaller amount can also help.";
  else if (/incorrect|invalid|expired|cvc|zip|postal/.test(m)) t = "Check the card number, expiry date, security code and ZIP, then try again.";
  else if (/credit card|name on the card/.test(m)) return "";
  return t ? ` <span class="sub2" style="display:block;color:var(--fg)">What to do: ${t} Questions? Call or text (262) 236-5443.</span>` : "";
}

function bindWork(v) {
  if (v !== "work") return;
  const flush = () => client.functions.invoke("outbox-flush", { body: {} }).catch(() => {});
  const refresh = async () => { await loadWork(); route(); };
  const imgs = [...document.querySelectorAll("img[data-wkph]")];
  if (imgs.length) client.storage.from("work-photos").createSignedUrls(imgs.map((i) => i.dataset.wkph), 3600).then(({ data }) => {
    const by = Object.fromEntries((data || []).map((x) => [x.path, x.signedUrl])); imgs.forEach((i) => { if (by[i.dataset.wkph]) i.src = by[i.dataset.wkph]; });
  });
  document.querySelectorAll(".wk").forEach((card) => {
    const id = card.dataset.wk, say = (sel, t, bad) => { const m = card.querySelector(sel); if (m) { m.className = "msg2 " + (bad ? "err" : "ok"); m.textContent = t; } };
    const ack = card.querySelector("[data-ack]");
    if (ack) ack.onclick = async () => {
      ack.disabled = true; const { error } = await client.rpc("resident_work_ack", { p_agreement: id, p_name: card.querySelector("[data-ackname]").value });
      if (error) { say("[data-wkmsg]", await errorText(error), true); ack.disabled = false; return; }
      flush(); refresh();
    };
    card.querySelectorAll("[data-task]").forEach((b) => b.onclick = async () => {
      b.disabled = true; const { error } = await client.rpc("resident_work_task", { p_agreement: id, p_task: b.dataset.task, p_status: b.dataset.to });
      if (error) { alert(await errorText(error)); b.disabled = false; return; }
      flush(); refresh();
    });
    const mic = card.querySelector("[data-mic]"), body = card.querySelector("[data-nbody]");
    let voice = false;
    if (mic) {
      const SR = window.SpeechRecognition || window.webkitSpeechRecognition; let rec = null, on = false;
      mic.onclick = () => {
        if (on) { rec.stop(); return; }
        rec = new SR(); rec.lang = "en-US"; rec.interimResults = true; rec.continuous = true; const base = body.value ? body.value.trim() + " " : "";
        rec.onresult = (e) => { let t = ""; for (const r of e.results) t += r[0].transcript; body.value = base + t; voice = true; };
        rec.onend = () => { on = false; mic.textContent = "🎤 Start talking"; };
        rec.onerror = () => { on = false; mic.textContent = "🎤 Start talking"; };
        rec.start(); on = true; mic.textContent = "■ Stop";
      };
    }
    const pin = card.querySelector("[data-nphoto]");
    if (pin) pin.onchange = () => { card.querySelector("[data-nphotoname]").textContent = pin.files[0] ? pin.files[0].name : ""; };
    const save = card.querySelector("[data-nsave]");
    if (save) save.onclick = async () => {
      save.disabled = true; say("[data-nmsg]", "Saving…");
      try {
        let photo = null;
        if (pin && pin.files[0]) {
          const blob = await shrinkPhoto(pin.files[0]), path = `${card.dataset.lease}/${crypto.randomUUID()}.jpg`;
          const up = await client.storage.from("work-photos").upload(path, blob, { contentType: "image/jpeg" });
          if (up.error) throw new Error("The photo didn't upload. Check your connection and try again.");
          photo = path;
        }
        const { error } = await client.rpc("resident_work_note", { p_agreement: id, p_task: card.querySelector("[data-nt]").value, p_note: body.value, p_voice: voice, p_photo: photo });
        if (error) throw new Error(await errorText(error));
        await refresh();
      } catch (e) { say("[data-nmsg]", e.message, true); save.disabled = false; }
    };
  });
}

    $("chkAsk") && ($("chkAsk").onclick = async () => {
      $("chkAsk").disabled = true; $("chkMsg").className = "msg2"; $("chkMsg").textContent = "Sending your request…";
      const { data, error } = await client.rpc("check_request_make", { p_kind: "tenant" });
      if (error || !data) { $("chkMsg").className = "msg2 err"; $("chkMsg").textContent = error ? await errorText(error) : "Couldn't send the request. Please try again."; $("chkAsk").disabled = false; return; }
      H.check = data; route();
    });
    $("apOn") && ($("apOn").onclick = () => { location.hash = "#autopay"; });
    $("apOff") && ($("apOff").onclick = () => { if (confirm("Cancel autopay? No more automatic withdrawals will be made.")) go({ action: "autopay_cancel" }, $("apOff")); });
    if (/stripe=done/.test(location.hash)) { $("spMsg").className = "msg2 ok"; $("spMsg").textContent = "Thank you! Your payment was submitted. Bank payments take a few business days to clear; you'll get a receipt by email."; }
    if (/autopay=done/.test(location.hash)) { $("spMsg").className = "msg2 ok"; $("spMsg").textContent = "Autopay is being set up. It may take a moment to show here."; }
    const l = leaseOf(), c = lc(), hist = l ? l.history : c ? c.history : [];
    $("more") && ($("more").onclick = () => { $("histBody").innerHTML = historyRows(hist); $("more").remove(); });
    $("stmt") && ($("stmt").onclick = async () => {
      $("stmt").disabled = true;
      try { await act({ action: "email_statement", lease_id: l.id }); $("stmtMsg").className = "msg2 ok"; $("stmtMsg").textContent = "Statement sent to your email."; }
      catch (e) { $("stmtMsg").className = "msg2 err"; $("stmtMsg").textContent = e.message; $("stmt").disabled = false; }
    });
  }
  if (v === "requests") {
    mountHvac($("hvacMount"));   // HVAC technician text card (Stephen, 11/5/2026)
    const flush = () => client.functions.invoke("outbox-flush", { body: {} }).catch(() => {});
    document.querySelectorAll("input[name=rqCat]").forEach((el) => el.onchange = () => { $("rqHeatWarn").hidden = !["heat", "plumbing"].includes(el.value); });
    document.querySelectorAll("input[name=rqPets]").forEach((el) => el.onchange = () => { $("rqPetsBox").hidden = el.value !== "yes"; });
    (async () => {
      const imgs = [...document.querySelectorAll("img[data-rqphoto], video[data-rqvideo]")];
      if (!imgs.length) return;
      const { data } = await client.storage.from("maintenance").createSignedUrls(imgs.map((i) => i.dataset.rqphoto || i.dataset.rqvideo), 600);
      (data || []).forEach((d, k) => { if (d.signedUrl) imgs[k].src = d.signedUrl; });
    })();
    $("rqSend").onclick = async () => {
      const m = $("rqMsg"), btn = $("rqSend"); btn.disabled = true; m.className = "msg2"; m.textContent = "Sending…";
      try {
        const cat = (document.querySelector("input[name=rqCat]:checked") || {}).value || null;
        const pets = (document.querySelector("input[name=rqPets]:checked") || {}).value;
        const files = [...$("rqPhotos").files].slice(0, 6), paths = [], tid = H.tenant_id;
        for (const f of files) {
          const path = `${tid}/${Date.now()}-${Math.random().toString(36).slice(2, 8)}.${(f.type.split("/")[1] || "jpg").replace("jpeg", "jpg")}`;
          const { error } = await client.storage.from("maintenance").upload(path, f, { contentType: f.type });
          if (error) throw new Error("A photo couldn't be uploaded. Try a smaller photo.");
          paths.push(path);
        }
        const { data, error } = await client.rpc("resident_create_request", { p_category: cat, p_subject: $("rqSubject").value, p_description: $("rqDesc").value,
          p_entry: $("rqEntry").value || null, p_has_pets: pets === undefined ? null : pets === "yes", p_pets_note: $("rqPetsNote").value, p_photos: paths });
        if (error) throw new Error(await errorText(error));
        flush();
        await reload(); location.hash = "#requests"; route();
        $("rqMsg").className = "msg2 ok"; $("rqMsg").textContent = `Request #${data.number} received. We'll email you at each step.`;
      } catch (e) { m.className = "msg2 err"; m.textContent = e.message; btn.disabled = false; }
    };
    const run = async (id, fn) => {
      const m = document.querySelector(`[data-rqmsg="${id}"]`); m.className = "msg2"; m.textContent = "Sending…";
      try { const { error } = await fn(); if (error) throw new Error(await errorText(error)); flush(); await reload(); route(); }
      catch (e) { m.className = "msg2 err"; m.textContent = e.message; }
    };
    // Add a photo or video to an open request (Stephen, 11/5/2026: e.g. a short video for a manufacturer).
    document.querySelectorAll("[data-rqmedia]").forEach((inp) => inp.onchange = () => {
      const f = inp.files[0], id = inp.dataset.rqmedia; if (!f) return;
      const m = document.querySelector(`[data-rqmsg="${id}"]`);
      if (!(f.type.startsWith("image/") || f.type.startsWith("video/"))) { m.className = "msg2 err"; m.textContent = "Choose a photo or a video."; return; }
      if (f.size > 50 * 1024 * 1024) { m.className = "msg2 err"; m.textContent = "That file is over 50 MB. Record a shorter video (10 to 20 seconds)."; return; }
      run(id, async () => {
        m.textContent = f.type.startsWith("video/") ? "Uploading the video… keep this page open." : "Uploading…";
        const ext = (f.name.split(".").pop() || f.type.split("/")[1] || "bin").toLowerCase().replace("jpeg", "jpg").replace(/[^a-z0-9]/g, "");
        const path = `${H.tenant_id}/${id}-${Date.now()}.${ext}`;
        const up = await client.storage.from("maintenance").upload(path, f, { contentType: f.type });
        if (up.error) return { error: { message: "The file couldn't be uploaded. Try a shorter video or a smaller photo." } };
        return client.rpc("resident_request_add_media", { p_id: id, p_path: path });
      });
    });
    document.querySelectorAll("[data-cmtsend]").forEach((b) => b.onclick = () => run(b.dataset.cmtsend, () =>
      client.rpc("resident_request_comment", { p_id: b.dataset.cmtsend, p_note: document.querySelector(`[data-cmt="${b.dataset.cmtsend}"]`).value })));
    document.querySelectorAll("[data-fixed]").forEach((b) => b.onclick = () => run(b.dataset.fixed, () =>
      client.rpc("resident_request_confirm", { p_id: b.dataset.fixed, p_fixed: true, p_note: null })));
    document.querySelectorAll("[data-notfixed]").forEach((b) => b.onclick = () => {
      const note = prompt("What's still wrong?"); if (!note) return;
      run(b.dataset.notfixed, () => client.rpc("resident_request_confirm", { p_id: b.dataset.notfixed, p_fixed: false, p_note: note }));
    });
  }
}

async function reload() {
  const { data, error } = await client.rpc("resident_home");
  if (error) throw new Error(await errorText(error));
  H = data;
  const [{ data: notices }, { data: reports }, { data: stripeSt }] = await Promise.all([client.rpc("resident_notices"), client.rpc("resident_payment_reports"), client.rpc("resident_stripe_status")]);
  H.notices = notices || []; H.reports = reports || []; H.stripe = stripeSt || {};
  { const { data: ck } = await client.rpc("check_request_mine", { p_kind: "tenant" }); H.check = ck || null; }
  { const { data: ap } = await client.rpc("autopay_status_mine"); H.autopay = ap || { enabled: false, authorizations: [] }; }
  const [{ data: rqs }, { data: prof }, { data: lts }, { data: anns }, { data: msgs }] = await Promise.all([client.rpc("resident_requests"), client.rpc("resident_profile"),
    client.rpc("resident_letters", { p_query: null }), client.rpc("resident_announcements"), client.rpc("resident_unread_messages")]);
  H.bank = await loadBank();
  H.profile = prof || null; H.letters = lts || []; H.letterResults = null; H.messages = null; H.parking = null; H.parkDir = null; H.pkMode = ""; await loadWork();
  if (anns) H.announcements = anns;
  $("msgBadge").hidden = !msgs; $("msgBadge").textContent = msgs || "";
  H.requests = rqs || H.requests || [];
  const { data: mo } = await client.rpc("resident_move_out");
  H.moveout = mo || null;
  $("navMoveOut").hidden = !H.moveout;
  const { data: rn } = await client.rpc("resident_renewal");
  H.renewal = rn || null;
  $("navRenewal").hidden = !H.renewal;
  const { data: mi } = await client.rpc("resident_move_in");
  H.movein = mi || null;
  $("navMoveIn").hidden = !H.movein;
  const { data: co } = await client.rpc("resident_move_out_check");
  H.checkout = co || null;
  $("navCheckout").hidden = !H.checkout;
  const { data: lcs } = await client.rpc("resident_land_contracts");
  H.lcs = lcs || [];
  $("navLC").hidden = !H.lcs.length;
  document.querySelectorAll("#nav a").forEach((a) => { const h = a.getAttribute("href").slice(1); if (BUYER_HIDDEN.includes(h)) a.hidden = isBuyer(); });
  H.lcTerms = null;
  if (isBuyer()) { const { data: tm } = await client.rpc("resident_land_contract_terms"); H.lcTerms = tm || null; }
  const { data: ids } = await client.rpc("resident_me");
  H.tenant_id = Array.isArray(ids) ? (typeof ids[0] === "string" ? ids[0] : Object.values(ids[0] || {})[0]) : null;
}

$("signOutLink").addEventListener("click", (e) => { e.preventDefault(); signOut(); });
window.addEventListener("hashchange", route);

const who = await signIn($("signin"), { audience: "resident" });
if (!who.is_resident) { $("signin").innerHTML = `<div class="banner bad">We don't have an active lease for this email${who.email ? " (" + esc(who.email) + ")" : ""}. Contact the office, or <button class="linkbtn" type="button" id="switchEmail">sign in with a different email</button>.</div>`; $("signin").hidden = false; $("switchEmail").onclick = signOut; }
else {
  try { await reload(); $("signinWrap").hidden = true; $("shell").hidden = false; route(); }
  catch (e) { $("signin").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; $("signin").hidden = false; }
}
</script>
<script src="/assets/report.js" defer></script>
</body>
</html>
